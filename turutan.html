<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seronok Sains — Turutan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#29ABE2;
    --sky-deep:#1E8FC4;
    --sun:#FFD23F;
    --grass:#4ECB71;
    --grass-deep:#33A857;
    --coral:#FF6B6B;
    --navy:#1B3358;
    --cream:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background: radial-gradient(ellipse at top, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stage{
    width:100%;
    max-width:520px;
    height:100vh;
    max-height:900px;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:18px 16px 10px;
  }

  header{ text-align:center; color:#fff; flex-shrink:0; z-index:2; }
  header h1{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:22px; margin:0; text-shadow:0 3px 0 rgba(27,51,88,0.35); }
  header p{ margin:2px 0 0; font-weight:600; font-size:13px; opacity:0.9; }

  #progress-wrap{ display:flex; justify-content:center; gap:8px; margin:10px 0 6px; z-index:2; }
  .star{ width:26px; height:26px; position:relative; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); }
  .star svg{width:100%;height:100%;}
  .star.filled{ animation: starPop 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes starPop{ 0%{transform:scale(0.3) rotate(-20deg);} 60%{transform:scale(1.3) rotate(8deg);} 100%{transform:scale(1) rotate(0deg);} }

  #mascot-zone{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:86px; z-index:2; position:relative; }
  #mascot{ width:72px; height:72px; transition: transform 0.35s cubic-bezier(.34,1.56,.64,1); filter: drop-shadow(0 6px 6px rgba(0,0,0,0.2)); transform-box: fill-box; transform-origin: center; }
  #mascot.idle{ animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-8px) rotate(2deg);} }
  #mascot.happy{ animation: cheer 0.6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes cheer{ 0%{transform:scale(1) rotate(0);} 30%{transform:scale(1.25) rotate(-8deg) translateY(-14px);} 55%{transform:scale(1.1) rotate(8deg) translateY(-6px);} 100%{transform:scale(1) rotate(0);} }
  #mascot.oops{ animation: sad 0.55s ease-in-out; }
  @keyframes sad{ 0%,100%{transform:translateY(0) rotate(0);} 30%{transform:translateY(4px) rotate(-6deg);} 60%{transform:translateY(4px) rotate(6deg);} }
  .wing{ transform-box: fill-box; transform-origin: top center; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); }
  #mascot.happy .wing-l{ transform: rotate(-55deg) translateY(-6px); }
  #mascot.happy .wing-r{ transform: rotate(55deg) translateY(-6px); }
  #mascot.idle .wing-l, #mascot.idle .wing-r{ animation: flap 2.6s ease-in-out infinite; }
  #mascot.idle .wing-r{ animation-delay: -1.3s; }
  @keyframes flap{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-6deg);} }
  #mascot.oops .wing-l{ transform: rotate(10deg); }
  #mascot.oops .wing-r{ transform: rotate(-10deg); }
  .brow{ transform-box: fill-box; transform-origin: center; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); }
  #mascot.happy .brow-l{ transform: translateY(-3px) rotate(-8deg); }
  #mascot.happy .brow-r{ transform: translateY(-3px) rotate(8deg); }
  #mascot.oops .brow-l{ transform: translateY(2px) rotate(14deg); }
  #mascot.oops .brow-r{ transform: translateY(2px) rotate(-14deg); }

  #speech{
    position:absolute; top:-4px; left:50%;
    background:#fff; color:var(--navy); font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px;
    padding:6px 14px; border-radius:20px; box-shadow:0 4px 0 rgba(0,0,0,0.1);
    opacity:0; transform:translate(-50%, 6px) scale(0.9);
    transition: all 0.3s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; z-index:5;
  }
  #speech::after{ content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); border:7px solid transparent; border-top-color:#fff; }
  #speech.show{opacity:1; transform:translate(-50%, 0) scale(1);}

  /* sequence row — fixed height so it never shifts as the pile below shrinks */
  #sequence-zone{ height:150px; flex-shrink:0; display:flex; align-items:center; justify-content:center; z-index:3; }
  #sequence-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .slot{
    width:100px; height:130px;
    border-radius:20px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.18);
    border:3px dashed rgba(255,255,255,0.65);
    color:#fff; position:relative;
    transition: all 0.2s cubic-bezier(.34,1.56,.64,1);
  }
  .slot .slot-num{
    position:absolute; top:6px; left:8px;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:12px;
    opacity:0.8;
  }
  .slot .slot-emoji{ font-size:34px; }
  .slot .slot-label{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:12px; margin-top:4px; text-align:center; padding:0 4px; }
  .slot.filled{ background: linear-gradient(160deg, var(--grass), var(--grass-deep)); border-style:solid; }
  .slot.correct-flash{ animation: slotYes 0.5s ease; }
  @keyframes slotYes{ 0%{filter:brightness(1);} 40%{filter:brightness(1.5);} 100%{filter:brightness(1);} }

  /* card pile */
  #pile-zone{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  #pile{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-content:center; max-width:460px; }
  .pile-card{
    width:88px; height:100px;
    background:var(--cream); border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 6px 0 rgba(27,51,88,0.25), 0 8px 14px rgba(0,0,0,0.2);
    cursor:pointer;
    transition: all 0.15s cubic-bezier(.34,1.56,.64,1);
  }
  .pile-card:active{ transform:scale(0.94); }
  .pile-card .card-emoji{ font-size:32px; }
  .pile-card .card-label{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:11px; color:var(--navy); margin-top:2px; text-align:center; padding:0 4px; }
  .pile-card.wrong-flash{ animation: cardNo 0.4s ease; }
  @keyframes cardNo{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  #toast{
    position:absolute; top:14px; left:50%; transform:translateX(-50%) translateY(-40px);
    background:var(--navy); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    padding:8px 18px; border-radius:30px; z-index:60; opacity:0;
    transition: all 0.4s cubic-bezier(.34,1.56,.64,1); white-space:nowrap;
  }
  #toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

  .confetti{ position:fixed; top:-10px; width:10px;height:10px; border-radius:2px; z-index:50; pointer-events:none; }

  #win-screen{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at top, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    z-index:100; text-align:center; color:#fff; font-family:'Baloo 2', sans-serif;
  }
  #win-screen.show{ display:flex; }
  #win-screen .big-emoji{ font-size:70px; animation: cheer 0.8s cubic-bezier(.34,1.56,.64,1); }
  #win-screen h2{ font-size:26px; margin:10px 0 4px; text-shadow:0 3px 0 rgba(27,51,88,0.35); }
  #win-screen p{ font-family:'Nunito',sans-serif; font-weight:700; opacity:0.9; margin:0 0 20px;}
  #replay-btn, #back-btn{
    background:var(--sun); color:var(--navy); border:none;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px;
    padding:12px 28px; border-radius:30px; box-shadow:0 6px 0 #E0AC1F; cursor:pointer; margin:4px;
  }
  #replay-btn:active, #back-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #E0AC1F; }
  #back-btn{ background:#EAF6FC; color:var(--sky-deep); box-shadow:0 6px 0 #CFE7F2; }
  #back-btn:active{ box-shadow:0 2px 0 #CFE7F2; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <h1>🔬 Seronok Sains</h1>
    <p id="topik-title">Memuatkan...</p>
  </header>

  <div id="progress-wrap"></div>

  <div id="mascot-zone">
    <svg id="mascot" class="idle" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="93" rx="24" ry="5" fill="rgba(27,51,88,0.2)"/>
      <path d="M 76 58 L 94 48 L 90 64 Z" fill="#3B9FC4"/>
      <path d="M 76 64 L 93 62 L 88 74 Z" fill="#3B9FC4"/>
      <path d="M 40 86 L 36 92 M 40 86 L 44 91" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M 60 86 L 56 91 M 60 86 L 64 92" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path class="wing wing-l" d="M 22 50 Q 4 56 10 76 Q 24 74 28 58 Z" fill="#3B9FC4"/>
      <path class="wing wing-r" d="M 78 50 Q 96 56 90 76 Q 76 74 72 58 Z" fill="#3B9FC4"/>
      <ellipse cx="50" cy="56" rx="28" ry="30" fill="#4FC3E0"/>
      <ellipse cx="50" cy="64" rx="17" ry="19" fill="#FFF6EC"/>
      <path d="M 47 22 Q 50 6 54 21" stroke="#3B9FC4" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path class="brow brow-l" d="M 28 33 Q 38 28 45 33" stroke="#3B9FC4" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path class="brow brow-r" d="M 55 33 Q 62 28 72 33" stroke="#3B9FC4" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="38" cy="48" r="13" fill="#fff"/>
      <circle cx="62" cy="48" r="13" fill="#fff"/>
      <circle id="pupilL" cx="40" cy="49" r="7" fill="#1B3358"/>
      <circle id="pupilR" cx="64" cy="49" r="7" fill="#1B3358"/>
      <circle cx="43" cy="45" r="2.2" fill="#fff"/>
      <circle cx="67" cy="45" r="2.2" fill="#fff"/>
      <path d="M 45 60 Q 50 55 55 60 Q 50 68 45 60 Z" fill="#FF9F43"/>

    <div id="speech"></div>
  </div>

  <div id="sequence-zone">
    <div id="sequence-row"></div>
  </div>

  <div id="pile-zone">
    <div id="pile"></div>
  </div>

  <div id="toast"></div>

  <div id="win-screen">
    <div class="big-emoji">🏆</div>
    <h2>Hebat! Turutan Betul!</h2>
    <p id="win-score">Skor: 4/4</p>

      <button id="replay-btn">Main Lagi</button>

</div>

<script>
const params = new URLSearchParams(location.search);
const topikKey = params.get('topik');

let stages = [];
let currentIndex = 0;
let topicData = null;
let resolvedTopik = null;

const progressWrap = document.getElementById('progress-wrap');
const mascot = document.getElementById('mascot');
const pupilL = document.getElementById('pupilL');
const pupilR = document.getElementById('pupilR');
const speech = document.getElementById('speech');
const toast = document.getElementById('toast');
const winScreen = document.getElementById('win-screen');
const winScore = document.getElementById('win-score');
const topikTitle = document.getElementById('topik-title');
const sequenceRow = document.getElementById('sequence-row');
const pile = document.getElementById('pile');

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

async function loadTopic(){
  const res = await fetch('data/turutan-questions.json');
  const bank = await res.json();
  const keys = Object.keys(bank);
  const key = (topikKey && bank[topikKey]) ? topikKey : keys[0];
  resolvedTopik = key;
  topicData = bank[key];

  document.title = `Seronok Sains — ${topicData.topikLabel}`;
  topikTitle.textContent = `${topicData.topikLabel} — Tahun ${topicData.tahun}`;

  stages = topicData.stages;
  currentIndex = 0;

  progressWrap.innerHTML = '';
  stages.forEach(() => {
    const s = document.createElement('div');
    s.className='star';
    s.innerHTML = starSVG(false);
    progressWrap.appendChild(s);
  });

  sequenceRow.innerHTML = '';
  stages.forEach((_, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.slot = i;
    slot.innerHTML = `<span class="slot-num">${i+1}</span><span class="slot-emoji">?</span>`;
    sequenceRow.appendChild(slot);
  });

  renderPile();
}

function renderPile(){
  pile.innerHTML = '';
  const remaining = stages
    .map((s, i) => ({ ...s, stageIndex: i }))
    .filter(s => s.stageIndex >= currentIndex);
  shuffle(remaining).forEach(s => {
    const card = document.createElement('div');
    card.className = 'pile-card';
    card.dataset.stageIndex = s.stageIndex;
    card.innerHTML = `<span class="card-emoji">${s.emoji}</span><span class="card-label">${s.label}</span>`;
    card.addEventListener('click', () => handleTap(card, s.stageIndex));
    pile.appendChild(card);
  });
}

function starSVG(filled){
  return `<svg viewBox="0 0 24 24"><path d="M12 1l3.2 6.9L22 9l-5 5.1L18.4 22 12 18.3 5.6 22 7 14.1 2 9l6.8-1.1z" fill="${filled? '#FFD23F':'rgba(255,255,255,0.35)'}" stroke="#fff" stroke-width="1"/></svg>`;
}

function say(text, ms=1400){
  speech.textContent = text;
  speech.classList.add('show');
  clearTimeout(say._t);
  say._t = setTimeout(()=> speech.classList.remove('show'), ms);
}

function playTone(freqs, dur=0.12, type='sine'){
  try{
    const ctx = playTone._ctx || (playTone._ctx = new (window.AudioContext||window.webkitAudioContext)());
    let t = ctx.currentTime;
    freqs.forEach((f)=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+dur+0.02);
      t += dur*0.55;
    });
  }catch(e){}
}

function confettiBurst(x,y){
  const colors = ['#FFD23F','#4ECB71','#29ABE2','#FF6B6B','#fff'];
  for(let i=0;i<24;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.left = x+'px';
    c.style.top = y+'px';
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*120;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 80;
    const rot = Math.random()*720-360;
    document.body.appendChild(c);
    c.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px, ${dy+220}px) rotate(${rot}deg)`, opacity:0}
    ], {duration: 900+Math.random()*400, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = ()=> c.remove();
  }
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 900);
}

function handleTap(cardEl, stageIndex){
  if(stageIndex === currentIndex){
    const stage = stages[currentIndex];
    const slot = sequenceRow.querySelector(`.slot[data-slot="${currentIndex}"]`);
    slot.classList.add('filled', 'correct-flash');
    slot.innerHTML = `<span class="slot-num">${currentIndex+1}</span><span class="slot-emoji">${stage.emoji}</span><span class="slot-label">${stage.label}</span>`;
    setTimeout(()=> slot.classList.remove('correct-flash'), 500);

    const rect = slot.getBoundingClientRect();
    confettiBurst(rect.left+rect.width/2, rect.top+rect.height/2);
    playTone([523.25, 659.25, 783.99], 0.14);
    mascot.classList.remove('idle'); mascot.classList.add('happy');
    pupilL.setAttribute('r','9'); pupilR.setAttribute('r','9');
    const praises = ['Bagus!','Betul tu!','Hebat!','Pandai!','Yes!'];
    say(praises[Math.floor(Math.random()*praises.length)]);
    showToast('✅ Betul!');
    const starEls = progressWrap.children;
    starEls[currentIndex].innerHTML = starSVG(true);
    starEls[currentIndex].classList.add('filled');
    setTimeout(()=>{
      mascot.classList.remove('happy'); mascot.classList.add('idle');
      pupilL.setAttribute('r','7'); pupilR.setAttribute('r','7');
    }, 600);

    currentIndex++;
    if(currentIndex >= stages.length){
      setTimeout(showWin, 700);
    } else {
      renderPile();
    }
  } else {
    cardEl.classList.add('wrong-flash');
    setTimeout(()=>cardEl.classList.remove('wrong-flash'), 400);
    playTone([220, 196], 0.16, 'triangle');
    mascot.classList.remove('idle'); mascot.classList.add('oops');
    pupilL.setAttribute('r','5'); pupilR.setAttribute('r','5');
    const hints = ['Bukan itu dulu!','Fikir turutan!','Cuba lagi'];
    say(hints[Math.floor(Math.random()*hints.length)]);
    showToast('Cuba lagi ya 💪');
    setTimeout(()=>{
      mascot.classList.remove('oops'); mascot.classList.add('idle');
      pupilL.setAttribute('r','7'); pupilR.setAttribute('r','7');
    }, 550);
  }
}

function showWin(){
  writeProgress('turutan', resolvedTopik, topicData.topikLabel, stages.length, stages.length);
  winScore.textContent = `Skor: ${stages.length}/${stages.length}`;
  winScreen.classList.add('show');
  confettiBurst(window.innerWidth/2, window.innerHeight*0.35);
  setTimeout(()=>confettiBurst(window.innerWidth*0.3, window.innerHeight*0.3), 200);
  setTimeout(()=>confettiBurst(window.innerWidth*0.7, window.innerHeight*0.3), 400);
  playTone([523.25,659.25,783.99,1046.5], 0.16);
}

document.getElementById('replay-btn').addEventListener('click', ()=>{
  winScreen.classList.remove('show');
  currentIndex = 0;
  [...sequenceRow.children].forEach((slot, i) => {
    slot.classList.remove('filled');
    slot.innerHTML = `<span class="slot-num">${i+1}</span><span class="slot-emoji">?</span>`;
  });
  [...progressWrap.children].forEach(s=> s.innerHTML = starSVG(false));
  renderPile();
});
document.getElementById('back-btn').addEventListener('click', ()=>{
  window.location.href = 'game-hub.html';
});

/* ---------- progress tracking (Kemajuan: leaderboard/streak/badges) ----------
   Best-effort side effect — never blocks or breaks gameplay if it fails. */
const PROGRESS_FIREBASE_CONFIG = {
  apiKey: "AIzaSyDlmo9-iUOR5aBjoWg5Rqk8TVhYY7mr7Ik",
  authDomain: "seronoknyabahasa.firebaseapp.com",
  projectId: "seronoknyabahasa",
  storageBucket: "seronoknyabahasa.firebasestorage.app",
  messagingSenderId: "512712221726",
  appId: "1:512712221726:web:618e8e73ebe08315493a0f"
};
let _pdbFs = null, _pdbMod = null;
async function initProgressDB(){
  try{
    const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const app = appMod.initializeApp(PROGRESS_FIREBASE_CONFIG);
    _pdbFs = fsMod.getFirestore(app);
    _pdbMod = fsMod;
  }catch(e){
    console.warn('Progress tracking tidak dapat disambung:', e);
  }
}
initProgressDB();

function todayLocal(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const BADGE_RULES = [
  { id: 'first-play', check: p => p.totalPlays >= 1 },
  { id: '5-topics', check: p => p.totalPlays >= 5 },
  { id: '20-topics', check: p => p.totalPlays >= 20 },
  { id: '3-day-streak', check: p => p.currentStreak >= 3 },
  { id: '7-day-streak', check: p => p.currentStreak >= 7 },
  { id: 'all-mechanics', check: p => Object.keys(p.mechanicsPlayed||{}).length >= 10 },
  { id: 'perfect-score', check: (p, justPerfect) => justPerfect }
];

async function writeProgress(mechanic, topikKey, topikLabel, score, total){
  try{
    if(!_pdbFs) await initProgressDB();
    if(!_pdbFs) return;
    const raw = sessionStorage.getItem('ss_activeStudent');
    if(!raw) return;
    const student = JSON.parse(raw);
    const { doc, getDoc, setDoc, increment } = _pdbMod;
    const ref = doc(_pdbFs, 'sains_progress', student.id);
    const snap = await getDoc(ref);
    const prev = snap.exists() ? snap.data() : null;

    const today = todayLocal();
    let currentStreak = 1;
    if(prev && prev.lastPlayedDate === today){
      currentStreak = prev.currentStreak || 1;
    } else if(prev){
      const y = new Date(); y.setDate(y.getDate()-1);
      const yesterday = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
      currentStreak = prev.lastPlayedDate === yesterday ? (prev.currentStreak||0)+1 : 1;
    }
    const longestStreak = Math.max(prev?.longestStreak || 0, currentStreak);

    const mechanicsPlayed = { ...(prev?.mechanicsPlayed || {}) };
    mechanicsPlayed[mechanic] = (mechanicsPlayed[mechanic] || 0) + 1;

    const isPerfect = total > 0 && score === total;
    const progressState = { totalPlays: (prev?.totalPlays || 0) + 1, currentStreak, mechanicsPlayed };
    const existingBadges = new Set(prev?.badges || []);
    BADGE_RULES.forEach(b => {
      if(!existingBadges.has(b.id) && b.check(progressState, isPerfect)) existingBadges.add(b.id);
    });

    await setDoc(ref, {
      name: student.namaAnak,
      tahun: student.tahun,
      kelas: student.kelas,
      totalStars: increment(score),
      totalPlays: increment(1),
      mechanicsPlayed: { [mechanic]: increment(1) },
      currentStreak, longestStreak,
      lastPlayedDate: today,
      badges: [...existingBadges],
      updatedAt: today
    }, { merge:true });
  }catch(e){
    console.warn('Gagal menyimpan kemajuan:', e);
  }
}

loadTopic();
</script>

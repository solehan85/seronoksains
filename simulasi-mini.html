<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seronok Sains — Simulasi Mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#29ABE2;
    --sky-deep:#1E8FC4;
    --sun:#FFD23F;
    --grass:#4ECB71;
    --grass-deep:#33A857;
    --coral:#FF6B6B;
    --navy:#1B3358;
    --cream:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background: radial-gradient(ellipse at top, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stage{
    width:100%;
    max-width:520px;
    height:100vh;
    max-height:900px;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:18px 16px 10px;
  }

  header{ text-align:center; color:#fff; flex-shrink:0; z-index:2; }
  header h1{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:22px; margin:0; text-shadow:0 3px 0 rgba(27,51,88,0.35); }
  header p{ margin:2px 0 0; font-weight:600; font-size:13px; opacity:0.9; }

  #progress-wrap{ display:flex; justify-content:center; gap:6px; margin:10px 0 4px; z-index:2; flex-wrap:wrap; }
  .star{ width:20px; height:20px; position:relative; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); }
  .star svg{width:100%;height:100%;}
  .star.filled{ animation: starPop 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes starPop{ 0%{transform:scale(0.3) rotate(-20deg);} 60%{transform:scale(1.3) rotate(8deg);} 100%{transform:scale(1) rotate(0deg);} }

  #mascot-zone{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:70px; z-index:2; position:relative; }
  #mascot{ width:60px; height:60px; transition: transform 0.35s cubic-bezier(.34,1.56,.64,1); filter: drop-shadow(0 6px 6px rgba(0,0,0,0.2)); transform-box: fill-box; transform-origin: center; }
  #mascot.idle{ animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-8px) rotate(2deg);} }
  #mascot.happy{ animation: cheer 0.6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes cheer{ 0%{transform:scale(1) rotate(0);} 30%{transform:scale(1.25) rotate(-8deg) translateY(-14px);} 55%{transform:scale(1.1) rotate(8deg) translateY(-6px);} 100%{transform:scale(1) rotate(0);} }
  #mascot.oops{ animation: sad 0.55s ease-in-out; }
  @keyframes sad{ 0%,100%{transform:translateY(0) rotate(0);} 30%{transform:translateY(4px) rotate(-6deg);} 60%{transform:translateY(4px) rotate(6deg);} }
  .wing{ transform-box: fill-box; transform-origin: top center; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); }
  #mascot.happy .wing-l{ transform: rotate(-55deg) translateY(-6px); }
  #mascot.happy .wing-r{ transform: rotate(55deg) translateY(-6px); }
  #mascot.idle .wing-l, #mascot.idle .wing-r{ animation: flap 2.6s ease-in-out infinite; }
  #mascot.idle .wing-r{ animation-delay: -1.3s; }
  @keyframes flap{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-6deg);} }
  #mascot.oops .wing-l{ transform: rotate(10deg); }
  #mascot.oops .wing-r{ transform: rotate(-10deg); }
  .brow{ transform-box: fill-box; transform-origin: center; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); }
  #mascot.happy .brow-l{ transform: translateY(-3px) rotate(-8deg); }
  #mascot.happy .brow-r{ transform: translateY(-3px) rotate(8deg); }
  #mascot.oops .brow-l{ transform: translateY(2px) rotate(14deg); }
  #mascot.oops .brow-r{ transform: translateY(2px) rotate(-14deg); }

  #speech{
    position:absolute; top:-4px; left:50%;
    background:#fff; color:var(--navy); font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px;
    padding:6px 14px; border-radius:20px; box-shadow:0 4px 0 rgba(0,0,0,0.1);
    opacity:0; transform:translate(-50%, 6px) scale(0.9);
    transition: all 0.3s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; z-index:5;
  }
  #speech::after{ content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); border:7px solid transparent; border-top-color:#fff; }
  #speech.show{opacity:1; transform:translate(-50%, 0) scale(1);}

  #sim-zone{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; z-index:3; min-height:0; gap:10px; padding:2px 0; }

  #circuit-card{
    background:var(--cream); border-radius:22px; padding:12px;
    box-shadow:0 8px 0 rgba(27,51,88,0.25), 0 12px 20px rgba(0,0,0,0.2);
  }
  .circuit{ width:220px; height:150px; display:block; }
  .switch-lever{ transform-origin: 150px 130px; transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); }
  .circuit.state-open .switch-lever{ transform: rotate(-26deg); }
  .circuit.state-closed .switch-lever{ transform: rotate(0deg); }
  .bulb-fill{ transition: fill 0.3s; fill:#B9C4CF; }
  .bulb-glow{ transition: opacity 0.3s; opacity:0; }
  .circuit.revealed.state-closed .bulb-fill{ fill:var(--sun); }
  .circuit.revealed.state-closed .bulb-glow{ opacity:0.85; }

  /* Kitaran Air diagram */
  .sun-fill{ transition: fill 0.3s; fill:#B9C4CF; }
  .sun-rays{ transition: opacity 0.3s; opacity:0; }
  .circuit.state-sun-active .sun-fill{ fill:var(--sun); }
  .circuit.state-sun-active .sun-rays{ opacity:1; }
  .vapor-arrow{ opacity:0; transform:translateY(8px); transform-box:fill-box; transform-origin:center; transition: all 0.4s cubic-bezier(.34,1.56,.64,1); }
  .circuit.revealed.state-sun-active .vapor-arrow{ opacity:0.9; transform:translateY(0); }

  /* Tumbuhan Perlukan Air diagram */
  .water-drop{ transition: opacity 0.3s; opacity:0; }
  .circuit.state-watered .water-drop{ opacity:1; }
  .plant-part{ fill:#B9C4CF; transition: fill 0.4s, transform 0.4s; transform-box:fill-box; transform-origin:bottom center; }
  .circuit.revealed.state-watered .plant-part{ fill:var(--grass); transform:rotate(0deg); }
  .circuit.revealed.state-unwatered .plant-part{ fill:#B08968; transform:rotate(16deg); }

  /* Cahaya & Bayang diagram */
  .light-object{ transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); transform-box:fill-box; }
  .circuit.state-blocked .light-object{ transform: translateY(0); }
  .circuit.state-notblocked .light-object{ transform: translateY(55px); }
  .shadow-shape{ opacity:0; transition: opacity 0.4s; }
  .circuit.revealed.state-blocked .shadow-shape{ opacity:0.55; }

  /* Ais Dipanaskan diagram */
  .flame-fill{ transition: fill 0.3s; fill:#B9C4CF; }
  .circuit.state-heated .flame-fill{ fill:var(--coral); }
  .ice-shape{ fill:#AEE6F5; transition: all 0.4s cubic-bezier(.34,1.56,.64,1); transform-box:fill-box; transform-origin:bottom center; }
  .circuit.revealed.state-heated .ice-shape{ transform:scaleY(0.3); fill:#1E8FC4; }

  /* Besi Berkarat diagram */
  .iron-fill{ transition: fill 0.5s; fill:#B9C4CF; }
  .circuit.revealed.state-exposed .iron-fill{ fill:#C97C3D; }
  .moisture-drop{ transition: opacity 0.3s; opacity:0; }
  .circuit.state-exposed .moisture-drop{ opacity:1; }

  #question-card{
    font-family:'Baloo 2', sans-serif; font-weight:700; color:#fff; text-shadow:0 2px 0 rgba(27,51,88,0.35);
    font-size:15px; text-align:center; max-width:400px; padding:0 8px;
  }

  #options-row{ display:flex; gap:14px; }
  .option-btn{
    background:#EAF6FC; color:var(--navy); border:none;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:16px;
    padding:14px 34px; border-radius:18px; cursor:pointer;
    box-shadow:0 5px 0 #CFE7F2;
    transition: all 0.15s cubic-bezier(.34,1.56,.64,1);
  }
  .option-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #CFE7F2; }
  .option-btn.correct{ background:linear-gradient(160deg, var(--grass), var(--grass-deep)); color:#fff; box-shadow:0 5px 0 var(--grass-deep); }
  .option-btn.wrong{ background:linear-gradient(160deg, var(--coral), #E24C4C); color:#fff; box-shadow:0 5px 0 #C23A3A; animation: shakeX 0.4s ease; }
  .option-btn.disabled{ pointer-events:none; opacity:0.85; }
  @keyframes shakeX{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  #toast{
    position:absolute; top:14px; left:50%; transform:translateX(-50%) translateY(-40px);
    background:var(--navy); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    padding:8px 18px; border-radius:30px; z-index:60; opacity:0;
    transition: all 0.4s cubic-bezier(.34,1.56,.64,1); white-space:nowrap;
  }
  #toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

  .confetti{ position:fixed; top:-10px; width:10px;height:10px; border-radius:2px; z-index:50; pointer-events:none; }

  #win-screen{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at top, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    z-index:100; text-align:center; color:#fff; font-family:'Baloo 2', sans-serif;
  }
  #win-screen.show{ display:flex; }
  #win-screen .big-emoji{ font-size:70px; animation: cheer 0.8s cubic-bezier(.34,1.56,.64,1); }
  #win-screen h2{ font-size:26px; margin:10px 0 4px; text-shadow:0 3px 0 rgba(27,51,88,0.35); }
  #win-screen p{ font-family:'Nunito',sans-serif; font-weight:700; opacity:0.9; margin:0 0 20px;}
  #replay-btn, #back-btn{
    background:var(--sun); color:var(--navy); border:none;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px;
    padding:12px 28px; border-radius:30px; box-shadow:0 6px 0 #E0AC1F; cursor:pointer; margin:4px;
  }
  #replay-btn:active, #back-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #E0AC1F; }
  #back-btn{ background:#EAF6FC; color:var(--sky-deep); box-shadow:0 6px 0 #CFE7F2; }
  #back-btn:active{ box-shadow:0 2px 0 #CFE7F2; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <h1>🔬 Seronok Sains</h1>
    <p id="topik-title">Memuatkan...</p>
  </header>

  <div id="progress-wrap"></div>

  <div id="mascot-zone">
    <svg id="mascot" class="idle" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="93" rx="24" ry="5" fill="rgba(27,51,88,0.2)"/>
      <path d="M 76 58 L 94 48 L 90 64 Z" fill="#3B9FC4"/>
      <path d="M 76 64 L 93 62 L 88 74 Z" fill="#3B9FC4"/>
      <path d="M 40 86 L 36 92 M 40 86 L 44 91" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M 60 86 L 56 91 M 60 86 L 64 92" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path class="wing wing-l" d="M 22 50 Q 4 56 10 76 Q 24 74 28 58 Z" fill="#3B9FC4"/>
      <path class="wing wing-r" d="M 78 50 Q 96 56 90 76 Q 76 74 72 58 Z" fill="#3B9FC4"/>
      <ellipse cx="50" cy="56" rx="28" ry="30" fill="#4FC3E0"/>
      <ellipse cx="50" cy="64" rx="17" ry="19" fill="#FFF6EC"/>
      <path d="M 47 22 Q 50 6 54 21" stroke="#3B9FC4" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path class="brow brow-l" d="M 28 33 Q 38 28 45 33" stroke="#3B9FC4" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path class="brow brow-r" d="M 55 33 Q 62 28 72 33" stroke="#3B9FC4" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="38" cy="48" r="13" fill="#fff"/>
      <circle cx="62" cy="48" r="13" fill="#fff"/>
      <circle id="pupilL" cx="40" cy="49" r="7" fill="#1B3358"/>
      <circle id="pupilR" cx="64" cy="49" r="7" fill="#1B3358"/>
      <circle cx="43" cy="45" r="2.2" fill="#fff"/>
      <circle cx="67" cy="45" r="2.2" fill="#fff"/>
      <path d="M 45 60 Q 50 55 55 60 Q 50 68 45 60 Z" fill="#FF9F43"/>
    </svg>
    <div id="speech"></div>
  </div>

  <div id="sim-zone">
    <div id="circuit-card">
      <svg id="circuit-svg" class="circuit" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg">
        <!-- wire loop (with gap for switch) -->
        <line x1="30" y1="30" x2="210" y2="30" stroke="#7A8CA3" stroke-width="6" stroke-linecap="round"/>
        <line x1="210" y1="30" x2="210" y2="130" stroke="#7A8CA3" stroke-width="6" stroke-linecap="round"/>
        <line x1="210" y1="130" x2="150" y2="130" stroke="#7A8CA3" stroke-width="6" stroke-linecap="round"/>
        <line x1="90" y1="130" x2="30" y2="130" stroke="#7A8CA3" stroke-width="6" stroke-linecap="round"/>
        <line x1="30" y1="130" x2="30" y2="30" stroke="#7A8CA3" stroke-width="6" stroke-linecap="round"/>

        <!-- battery symbol (on left wire) -->
        <line x1="16" y1="74" x2="44" y2="74" stroke="#1B3358" stroke-width="5" stroke-linecap="round"/>
        <line x1="22" y1="86" x2="38" y2="86" stroke="#1B3358" stroke-width="9" stroke-linecap="round"/>

        <!-- switch: pivot + fixed contact + lever -->
        <circle cx="150" cy="130" r="6" fill="#5C7690"/>
        <circle cx="90" cy="130" r="6" fill="#5C7690"/>
        <line class="switch-lever" x1="150" y1="130" x2="90" y2="130" stroke="#1B3358" stroke-width="5" stroke-linecap="round"/>

        <!-- bulb -->
        <circle class="bulb-glow" cx="210" cy="80" r="34" fill="var(--sun)"/>
        <circle class="bulb-fill" cx="210" cy="80" r="20" stroke="#7A8CA3" stroke-width="3"/>
        <line x1="200" y1="70" x2="220" y2="90" stroke="#5C7690" stroke-width="2"/>
        <line x1="220" y1="70" x2="200" y2="90" stroke="#5C7690" stroke-width="2"/>
      </svg>

      <svg id="circuit-svg-kitaran-air" class="circuit" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <!-- water body -->
        <rect x="20" y="120" width="200" height="30" rx="10" fill="#29ABE2"/>

        <!-- cloud (decorative, always visible) -->
        <circle cx="165" cy="42" r="16" fill="#E4EEF3"/>
        <circle cx="180" cy="36" r="20" fill="#E4EEF3"/>
        <circle cx="198" cy="44" r="15" fill="#E4EEF3"/>
        <rect x="160" y="42" width="46" height="16" rx="8" fill="#E4EEF3"/>

        <!-- sun -->
        <line class="sun-rays" x1="50" y1="10" x2="50" y2="18" stroke="var(--sun)" stroke-width="4" stroke-linecap="round"/>
        <line class="sun-rays" x1="24" y1="22" x2="30" y2="28" stroke="var(--sun)" stroke-width="4" stroke-linecap="round"/>
        <line class="sun-rays" x1="76" y1="22" x2="70" y2="28" stroke="var(--sun)" stroke-width="4" stroke-linecap="round"/>
        <line class="sun-rays" x1="18" y1="45" x2="26" y2="45" stroke="var(--sun)" stroke-width="4" stroke-linecap="round"/>
        <circle class="sun-fill" cx="50" cy="45" r="22"/>

        <!-- rising vapor arrows -->
        <path class="vapor-arrow" d="M 85 118 L 90 100 L 95 118" stroke="#7A8CA3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="vapor-arrow" d="M 115 118 L 120 96 L 125 118" stroke="#7A8CA3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="vapor-arrow" d="M 145 118 L 150 100 L 155 118" stroke="#7A8CA3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <svg id="circuit-svg-tumbuhan-air" class="circuit" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <!-- pot -->
        <path d="M 95 150 L 105 115 L 135 115 L 145 150 Z" fill="#C97C3D"/>
        <!-- stem -->
        <line x1="120" y1="115" x2="120" y2="70" stroke="#33A857" stroke-width="6" stroke-linecap="round"/>
        <!-- leaves -->
        <ellipse class="plant-part" cx="100" cy="85" rx="20" ry="11" transform="rotate(-20 100 85)"/>
        <ellipse class="plant-part" cx="140" cy="85" rx="20" ry="11" transform="rotate(20 140 85)"/>
        <!-- bud/flower -->
        <circle class="plant-part" cx="120" cy="62" r="14"/>
        <!-- water drops (shown when watered, always accurate) -->
        <path class="water-drop" d="M 70 30 C 70 38 62 38 62 30 C 62 24 70 16 70 16 C 70 16 78 24 78 30 C 78 38 70 38 70 30 Z" fill="#29ABE2"/>
        <path class="water-drop" d="M 175 20 C 175 26 169 26 169 20 C 169 16 175 10 175 10 C 175 10 181 16 181 20 C 181 26 175 26 175 20 Z" fill="#29ABE2"/>
      </svg>

      <svg id="circuit-svg-cahaya-bayang" class="circuit" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <!-- ground -->
        <line x1="10" y1="140" x2="230" y2="140" stroke="#B9C4CF" stroke-width="4" stroke-linecap="round"/>
        <!-- lamp -->
        <circle cx="30" cy="80" r="14" fill="var(--sun)"/>
        <line x1="46" y1="65" x2="200" y2="30" stroke="var(--sun)" stroke-width="2" opacity="0.6"/>
        <line x1="46" y1="80" x2="200" y2="80" stroke="var(--sun)" stroke-width="2" opacity="0.6"/>
        <line x1="46" y1="95" x2="200" y2="130" stroke="var(--sun)" stroke-width="2" opacity="0.6"/>
        <!-- object (position toggles in/out of light path) -->
        <rect class="light-object" x="110" y="60" width="18" height="80" rx="4" fill="#5C7690"/>
        <!-- shadow on ground -->
        <ellipse class="shadow-shape" cx="165" cy="140" rx="40" ry="8" fill="#1B3358"/>
      </svg>

      <svg id="circuit-svg-ais-cair" class="circuit" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <!-- tray -->
        <rect x="70" y="128" width="100" height="14" rx="6" fill="#B9C4CF"/>
        <!-- ice cube -->
        <rect class="ice-shape" x="90" y="88" width="60" height="42" rx="8"/>
        <!-- flame -->
        <path class="flame-fill" d="M 190 130 C 180 115 195 105 190 90 C 205 100 210 118 200 130 C 197 133 193 133 190 130 Z"/>
      </svg>

      <svg id="circuit-svg-besi-karat" class="circuit" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <!-- iron bar -->
        <rect class="iron-fill" x="55" y="70" width="130" height="26" rx="8"/>
        <circle class="iron-fill" cx="55" cy="83" r="13"/>
        <circle class="iron-fill" cx="185" cy="83" r="13"/>
        <!-- moisture drops (shown when exposed, always accurate) -->
        <path class="moisture-drop" d="M 70 40 C 70 46 64 46 64 40 C 64 35 70 28 70 28 C 70 28 76 35 76 40 C 76 46 70 46 70 40 Z" fill="#29ABE2"/>
        <path class="moisture-drop" d="M 120 30 C 120 36 114 36 114 30 C 114 25 120 18 120 18 C 120 18 126 25 126 30 C 126 36 120 36 120 30 Z" fill="#29ABE2"/>
        <path class="moisture-drop" d="M 170 40 C 170 46 164 46 164 40 C 164 35 170 28 170 28 C 170 28 176 35 176 40 C 176 46 170 46 170 40 Z" fill="#29ABE2"/>
      </svg>
    </div>
    <div id="question-card">Memuatkan...</div>
    <div id="options-row">
      <button class="option-btn" id="btn-ya">Ya</button>
      <button class="option-btn" id="btn-tidak">Tidak</button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="win-screen">
    <div class="big-emoji">🏆</div>
    <h2>Hebat! Simulasi Selesai!</h2>
    <p id="win-score">Skor: 8/8</p>
    <div>
      <button id="replay-btn">Main Lagi</button>
      <button id="back-btn">Menu</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const topikKey = params.get('topik');

let rounds = [];
let idx = 0;
let score = 0;
let topicData = null;
let resolvedTopik = null;
let answered = false;

const progressWrap = document.getElementById('progress-wrap');
const mascot = document.getElementById('mascot');
const pupilL = document.getElementById('pupilL');
const pupilR = document.getElementById('pupilR');
const speech = document.getElementById('speech');
const toast = document.getElementById('toast');
const winScreen = document.getElementById('win-screen');
const winScore = document.getElementById('win-score');
const topikTitle = document.getElementById('topik-title');
const questionCard = document.getElementById('question-card');
const btnYa = document.getElementById('btn-ya');
const btnTidak = document.getElementById('btn-tidak');

const DIAGRAM_CONFIGS = {
  litar: {
    svgId: 'circuit-svg',
    stateClass: r => `state-${r.switchState}`,
    correctAnswer: r => r.switchState === 'closed' ? 'Ya' : 'Tidak',
    question: r => `Suis litar ini ${r.switchState === 'closed' ? 'TERTUTUP' : 'TERBUKA'}. Adakah mentol akan menyala?`
  },
  'kitaran-air': {
    svgId: 'circuit-svg-kitaran-air',
    stateClass: r => `state-sun-${r.sunActive ? 'active' : 'inactive'}`,
    correctAnswer: r => r.sunActive ? 'Ya' : 'Tidak',
    question: r => r.sunActive
      ? 'Matahari sedang memanaskan air. Adakah air akan menyejat (menjadi wap)?'
      : 'Matahari tidak memanaskan air sekarang. Adakah air akan menyejat (menjadi wap)?'
  },
  'tumbuhan-air': {
    svgId: 'circuit-svg-tumbuhan-air',
    stateClass: r => `state-${r.watered ? 'watered' : 'unwatered'}`,
    correctAnswer: r => r.watered ? 'Ya' : 'Tidak',
    question: r => r.watered
      ? 'Pokok ini disiram air setiap hari. Adakah ia akan membesar dengan segar?'
      : 'Pokok ini TIDAK disiram air. Adakah ia akan membesar dengan segar?'
  },
  'cahaya-bayang': {
    svgId: 'circuit-svg-cahaya-bayang',
    stateClass: r => `state-${r.blocked ? 'blocked' : 'notblocked'}`,
    correctAnswer: r => r.blocked ? 'Ya' : 'Tidak',
    question: r => r.blocked
      ? 'Objek ini menghalang laluan cahaya lampu. Adakah bayang akan terbentuk?'
      : 'Objek ini TIDAK menghalang laluan cahaya lampu. Adakah bayang akan terbentuk?'
  },
  'ais-cair': {
    svgId: 'circuit-svg-ais-cair',
    stateClass: r => `state-${r.heated ? 'heated' : 'notheated'}`,
    correctAnswer: r => r.heated ? 'Ya' : 'Tidak',
    question: r => r.heated
      ? 'Ais ini dipanaskan. Adakah ia akan cair menjadi air?'
      : 'Ais ini TIDAK dipanaskan (kekal sejuk). Adakah ia akan cair menjadi air?'
  },
  'besi-karat': {
    svgId: 'circuit-svg-besi-karat',
    stateClass: r => `state-${r.exposed ? 'exposed' : 'notexposed'}`,
    correctAnswer: r => r.exposed ? 'Ya' : 'Tidak',
    question: r => r.exposed
      ? 'Besi ini terdedah kepada air dan udara dalam tempoh lama. Adakah ia akan berkarat?'
      : 'Besi ini disimpan kering dan tidak terdedah kepada air. Adakah ia akan berkarat?'
  }
};
let activeConfig = DIAGRAM_CONFIGS.litar;
let circuitSvg = document.getElementById('circuit-svg');

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

async function loadTopic(){
  const res = await fetch('data/simulasi-mini-questions.json');
  const bank = await res.json();
  const keys = Object.keys(bank);
  const key = (topikKey && bank[topikKey]) ? topikKey : keys[0];
  resolvedTopik = key;
  topicData = bank[key];

  document.title = `Seronok Sains — ${topicData.topikLabel}`;
  topikTitle.textContent = `${topicData.topikLabel} — Tahun ${topicData.tahun}`;

  activeConfig = DIAGRAM_CONFIGS[topicData.diagramType || 'litar'];
  Object.values(DIAGRAM_CONFIGS).forEach(cfg => {
    document.getElementById(cfg.svgId).style.display = (cfg === activeConfig) ? '' : 'none';
  });
  circuitSvg = document.getElementById(activeConfig.svgId);

  const setIdx = Math.floor(Math.random() * topicData.sets.length);
  rounds = shuffle([...topicData.sets[setIdx]]);
  idx = 0; score = 0;

  progressWrap.innerHTML = '';
  rounds.forEach(() => {
    const s = document.createElement('div');
    s.className='star';
    s.innerHTML = starSVG(false);
    progressWrap.appendChild(s);
  });

  loadRound();
}

function starSVG(filled){
  return `<svg viewBox="0 0 24 24"><path d="M12 1l3.2 6.9L22 9l-5 5.1L18.4 22 12 18.3 5.6 22 7 14.1 2 9l6.8-1.1z" fill="${filled? '#FFD23F':'rgba(255,255,255,0.35)'}" stroke="#fff" stroke-width="1"/></svg>`;
}

function say(text, ms=1400){
  speech.textContent = text;
  speech.classList.add('show');
  clearTimeout(say._t);
  say._t = setTimeout(()=> speech.classList.remove('show'), ms);
}

function playTone(freqs, dur=0.12, type='sine'){
  try{
    const ctx = playTone._ctx || (playTone._ctx = new (window.AudioContext||window.webkitAudioContext)());
    let t = ctx.currentTime;
    freqs.forEach((f)=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+dur+0.02);
      t += dur*0.55;
    });
  }catch(e){}
}

function confettiBurst(x,y){
  const colors = ['#FFD23F','#4ECB71','#29ABE2','#FF6B6B','#fff'];
  for(let i=0;i<24;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.left = x+'px';
    c.style.top = y+'px';
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*120;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 80;
    const rot = Math.random()*720-360;
    document.body.appendChild(c);
    c.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px, ${dy+220}px) rotate(${rot}deg)`, opacity:0}
    ], {duration: 900+Math.random()*400, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = ()=> c.remove();
  }
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 900);
}

function loadRound(){
  answered = false;
  const r = rounds[idx];
  circuitSvg.setAttribute('class', `circuit ${activeConfig.stateClass(r)}`);
  questionCard.textContent = activeConfig.question(r);
  btnYa.className = 'option-btn';
  btnTidak.className = 'option-btn';
}

function handleAnswer(chosen){
  if(answered) return;
  answered = true;
  const r = rounds[idx];
  const correctAnswer = activeConfig.correctAnswer(r);
  const isCorrect = chosen === correctAnswer;

  btnYa.classList.add('disabled');
  btnTidak.classList.add('disabled');
  const chosenBtn = chosen === 'Ya' ? btnYa : btnTidak;
  const correctBtn = correctAnswer === 'Ya' ? btnYa : btnTidak;

  circuitSvg.classList.add('revealed');

  if(isCorrect){
    score++;
    chosenBtn.classList.add('correct');
    const rect = document.getElementById('circuit-card').getBoundingClientRect();
    confettiBurst(rect.left+rect.width/2, rect.top+rect.height/2);
    playTone([523.25, 659.25, 783.99], 0.14);
    mascot.classList.remove('idle'); mascot.classList.add('happy');
    pupilL.setAttribute('r','9'); pupilR.setAttribute('r','9');
    const praises = ['Bagus!','Betul tu!','Hebat!','Pandai!','Yes!'];
    say(praises[Math.floor(Math.random()*praises.length)]);
    showToast('✅ Betul!');
    const starEls = progressWrap.children;
    starEls[score-1].innerHTML = starSVG(true);
    starEls[score-1].classList.add('filled');
    setTimeout(()=>{
      mascot.classList.remove('happy'); mascot.classList.add('idle');
      pupilL.setAttribute('r','7'); pupilR.setAttribute('r','7');
    }, 600);
  } else {
    chosenBtn.classList.add('wrong');
    correctBtn.classList.add('correct');
    playTone([220, 196], 0.16, 'triangle');
    mascot.classList.remove('idle'); mascot.classList.add('oops');
    pupilL.setAttribute('r','5'); pupilR.setAttribute('r','5');
    const hints = ['Cuba lagi!','Hampir!','Fikir sekali lagi'];
    say(hints[Math.floor(Math.random()*hints.length)]);
    showToast('Cuba lagi ya 💪');
    setTimeout(()=>{
      mascot.classList.remove('oops'); mascot.classList.add('idle');
      pupilL.setAttribute('r','7'); pupilR.setAttribute('r','7');
    }, 550);
  }

  idx++;
  if(idx >= rounds.length){
    setTimeout(showWin, 1300);
  } else {
    setTimeout(loadRound, 1300);
  }
}

btnYa.addEventListener('click', ()=> handleAnswer('Ya'));
btnTidak.addEventListener('click', ()=> handleAnswer('Tidak'));

function showWin(){
  writeProgress('simulasi-mini', resolvedTopik, topicData.topikLabel, score, rounds.length);
  winScore.textContent = `Skor: ${score}/${rounds.length}`;
  winScreen.classList.add('show');
  confettiBurst(window.innerWidth/2, window.innerHeight*0.35);
  setTimeout(()=>confettiBurst(window.innerWidth*0.3, window.innerHeight*0.3), 200);
  setTimeout(()=>confettiBurst(window.innerWidth*0.7, window.innerHeight*0.3), 400);
  playTone([523.25,659.25,783.99,1046.5], 0.16);
}

document.getElementById('replay-btn').addEventListener('click', ()=>{
  winScreen.classList.remove('show');
  const setIdx = Math.floor(Math.random() * topicData.sets.length);
  rounds = shuffle([...topicData.sets[setIdx]]);
  idx = 0; score = 0;
  [...progressWrap.children].forEach(s=> s.innerHTML = starSVG(false));
  loadRound();
});
document.getElementById('back-btn').addEventListener('click', ()=>{
  window.location.href = 'game-hub.html';
});

let _pdbFs = null, _pdbMod = null;
async function initProgressDB(){
  try{
    const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const app = appMod.initializeApp(PROGRESS_FIREBASE_CONFIG);
    _pdbFs = fsMod.getFirestore(app);
    _pdbMod = fsMod;
  }catch(e){
    console.warn('Progress tracking tidak dapat disambung:', e);
  }
}
initProgressDB();

function todayLocal(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const BADGE_RULES = [
  { id: 'first-play', check: p => p.totalPlays >= 1 },
  { id: '5-topics', check: p => p.totalPlays >= 5 },
  { id: '20-topics', check: p => p.totalPlays >= 20 },
  { id: '3-day-streak', check: p => p.currentStreak >= 3 },
  { id: '7-day-streak', check: p => p.currentStreak >= 7 },
  { id: 'all-mechanics', check: p => Object.keys(p.mechanicsPlayed||{}).length >= 10 },
  { id: 'perfect-score', check: (p, justPerfect) => justPerfect }
];

async function writeProgress(mechanic, topikKey, topikLabel, score, total){
  try{
    if(!_pdbFs) await initProgressDB();
    if(!_pdbFs) return;
    const raw = sessionStorage.getItem('ss_activeStudent');
    if(!raw) return;
    const student = JSON.parse(raw);
    const { doc, getDoc, setDoc, increment } = _pdbMod;
    const ref = doc(_pdbFs, 'sains_progress', student.id);
    const snap = await getDoc(ref);
    const prev = snap.exists() ? snap.data() : null;

    const today = todayLocal();
    let currentStreak = 1;
    if(prev && prev.lastPlayedDate === today){
      currentStreak = prev.currentStreak || 1;
    } else if(prev){
      const y = new Date(); y.setDate(y.getDate()-1);
      const yesterday = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
      currentStreak = prev.lastPlayedDate === yesterday ? (prev.currentStreak||0)+1 : 1;
    }
    const longestStreak = Math.max(prev?.longestStreak || 0, currentStreak);

    const mechanicsPlayed = { ...(prev?.mechanicsPlayed || {}) };
    mechanicsPlayed[mechanic] = (mechanicsPlayed[mechanic] || 0) + 1;

    const isPerfect = total > 0 && score === total;
    const progressState = { totalPlays: (prev?.totalPlays || 0) + 1, currentStreak, mechanicsPlayed };
    const existingBadges = new Set(prev?.badges || []);
    BADGE_RULES.forEach(b => {
      if(!existingBadges.has(b.id) && b.check(progressState, isPerfect)) existingBadges.add(b.id);
    });

    await setDoc(ref, {
      name: student.namaAnak,
      tahun: student.tahun,
      kelas: student.kelas,
      totalStars: increment(score),
      totalPlays: increment(1),
      mechanicsPlayed: { [mechanic]: increment(1) },
      currentStreak, longestStreak,
      lastPlayedDate: today,
      badges: [...existingBadges],
      updatedAt: today
    }, { merge:true });
  }catch(e){
    console.warn('Gagal menyimpan kemajuan:', e);
  }
}

loadTopic();

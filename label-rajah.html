<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seronok Sains — Label Rajah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#29ABE2;
    --sky-deep:#1E8FC4;
    --sun:#FFD23F;
    --grass:#4ECB71;
    --grass-deep:#33A857;
    --coral:#FF6B6B;
    --navy:#1B3358;
    --cream:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background: radial-gradient(ellipse at top, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stage{
    width:100%;
    max-width:520px;
    height:100vh;
    max-height:900px;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:18px 16px 10px;
  }

  header{ text-align:center; color:#fff; flex-shrink:0; z-index:2; }
  header h1{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:22px; margin:0; text-shadow:0 3px 0 rgba(27,51,88,0.35); }
  header p{ margin:2px 0 0; font-weight:600; font-size:13px; opacity:0.9; }

  #progress-wrap{ display:flex; justify-content:center; gap:8px; margin:10px 0 6px; z-index:2; }
  .star{ width:26px; height:26px; position:relative; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); }
  .star svg{width:100%;height:100%;}
  .star.filled{ animation: starPop 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes starPop{ 0%{transform:scale(0.3) rotate(-20deg);} 60%{transform:scale(1.3) rotate(8deg);} 100%{transform:scale(1) rotate(0deg);} }

  #mascot-zone{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:90px; z-index:2; position:relative; }
  #mascot{ width:76px; height:76px; transition: transform 0.35s cubic-bezier(.34,1.56,.64,1); filter: drop-shadow(0 6px 6px rgba(0,0,0,0.2)); transform-box: fill-box; transform-origin: center; }
  #mascot.idle{ animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-8px) rotate(2deg);} }
  #mascot.happy{ animation: cheer 0.6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes cheer{ 0%{transform:scale(1) rotate(0);} 30%{transform:scale(1.25) rotate(-8deg) translateY(-14px);} 55%{transform:scale(1.1) rotate(8deg) translateY(-6px);} 100%{transform:scale(1) rotate(0);} }
  #mascot.oops{ animation: sad 0.55s ease-in-out; }
  @keyframes sad{ 0%,100%{transform:translateY(0) rotate(0);} 30%{transform:translateY(4px) rotate(-6deg);} 60%{transform:translateY(4px) rotate(6deg);} }
  .wing{ transform-box: fill-box; transform-origin: top center; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); }
  #mascot.happy .wing-l{ transform: rotate(-55deg) translateY(-6px); }
  #mascot.happy .wing-r{ transform: rotate(55deg) translateY(-6px); }
  #mascot.idle .wing-l, #mascot.idle .wing-r{ animation: flap 2.6s ease-in-out infinite; }
  #mascot.idle .wing-r{ animation-delay: -1.3s; }
  @keyframes flap{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-6deg);} }
  #mascot.oops .wing-l{ transform: rotate(10deg); }
  #mascot.oops .wing-r{ transform: rotate(-10deg); }
  .brow{ transform-box: fill-box; transform-origin: center; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); }
  #mascot.happy .brow-l{ transform: translateY(-3px) rotate(-8deg); }
  #mascot.happy .brow-r{ transform: translateY(-3px) rotate(8deg); }
  #mascot.oops .brow-l{ transform: translateY(2px) rotate(14deg); }
  #mascot.oops .brow-r{ transform: translateY(2px) rotate(-14deg); }

  #speech{
    position:absolute; top:-4px; left:50%;
    background:#fff; color:var(--navy); font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px;
    padding:6px 14px; border-radius:20px; box-shadow:0 4px 0 rgba(0,0,0,0.1);
    opacity:0; transform:translate(-50%, 6px) scale(0.9);
    transition: all 0.3s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; z-index:5;
  }
  #speech::after{ content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); border:7px solid transparent; border-top-color:#fff; }
  #speech.show{opacity:1; transform:translate(-50%, 0) scale(1);}

  /* diagram */
  #diagram-zone{ height:300px; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative; z-index:3; }
  #body-diagram{ position:relative; width:220px; height:280px; }
  .zone{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.18);
    border:3px dashed rgba(255,255,255,0.65);
    color:#fff; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:11px;
    text-align:center; padding:2px;
    transition: all 0.2s cubic-bezier(.34,1.56,.64,1);
  }
  .zone.hover{ transform:scale(1.06); border-color:#fff; box-shadow:0 0 0 5px rgba(255,255,255,0.35); }
  .zone.filled{ background: linear-gradient(160deg, var(--grass), var(--grass-deep)); border-style:solid; color:#fff; }
  .zone.correct-flash{ animation: zoneYes 0.5s ease; }
  @keyframes zoneYes{ 0%{filter:brightness(1);} 40%{filter:brightness(1.5);} 100%{filter:brightness(1);} }
  .zone.wrong-flash{ animation: zoneNo 0.4s ease; }
  @keyframes zoneNo{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .decor{ position:absolute; background: rgba(255,255,255,0.12); pointer-events:none; }

  /* Bahagian Badan (Tahun 1) */
  .kepala{ width:74px; height:74px; border-radius:50%; top:0; left:50%; margin-left:-37px; }
  .badan{ width:86px; height:110px; border-radius:26px; top:82px; left:50%; margin-left:-43px; }
  .tangan{ width:58px; height:32px; border-radius:16px; top:100px; left:160px; }
  .kaki{ width:64px; height:96px; border-radius:20px; top:200px; left:50%; margin-left:-32px; }

  /* Deria (Tahun 1) — face */
  .wajah{ width:180px; height:180px; border-radius:50%; top:0; left:50%; margin-left:-90px; }
  .mata{ width:100px; height:24px; border-radius:12px; top:55px; left:50%; margin-left:-50px; }
  .hidung{ width:30px; height:40px; border-radius:14px; top:85px; left:50%; margin-left:-15px; }
  .mulut{ width:50px; height:20px; border-radius:10px; top:135px; left:50%; margin-left:-25px; }
  .telinga{ width:24px; height:40px; border-radius:12px; top:80px; left:8px; }
  .kulit{ width:70px; height:50px; border-radius:16px; top:190px; left:50%; margin-left:-35px; }

  /* Sistem Badan Asas (Tahun 4) */
  .otak{ width:40px; height:35px; border-radius:14px; top:15px; left:50%; margin-left:-20px; }
  .jantung{ width:50px; height:28px; border-radius:14px; top:95px; left:50%; margin-left:-25px; }
  .paruparu{ width:70px; height:32px; border-radius:16px; top:128px; left:50%; margin-left:-35px; }
  .perut{ width:44px; height:25px; border-radius:12px; top:165px; left:50%; margin-left:-22px; }

  /* Sistem Badan Lanjutan (Tahun 6) */
  .hati{ width:56px; height:26px; border-radius:13px; top:100px; left:50%; margin-left:-28px; }
  .buahpinggang{ width:70px; height:24px; border-radius:12px; top:130px; left:50%; margin-left:-35px; }
  .usus{ width:60px; height:24px; border-radius:12px; top:157px; left:50%; margin-left:-30px; }
  .pundikencing{ width:40px; height:18px; border-radius:9px; top:184px; left:50%; margin-left:-20px; }

  /* Bumi-Bulan-Matahari (Tahun 5) */
  .matahari{ width:70px; height:70px; border-radius:50%; top:100px; left:10px; }
  .bumi{ width:45px; height:45px; border-radius:50%; top:115px; left:100px; }
  .bulan{ width:25px; height:25px; border-radius:50%; top:125px; left:165px; }

  /* Bahagian Serangga (Tahun 3) */
  .antena{ width:70px; height:22px; border-radius:11px; top:0; left:50%; margin-left:-35px; }
  .kepala-serangga{ width:56px; height:50px; border-radius:50%; top:26px; left:50%; margin-left:-28px; }
  .dada{ width:70px; height:45px; border-radius:18px; top:82px; left:50%; margin-left:-35px; }
  .perut-serangga{ width:80px; height:90px; border-radius:24px; top:133px; left:50%; margin-left:-40px; }
  .kaki-serangga{ width:44px; height:20px; border-radius:10px; top:95px; left:170px; }

  /* Bahagian Haiwan (Tahun 1) */
  .kepala-haiwan{ width:56px; height:50px; border-radius:50%; top:15px; left:50%; margin-left:-28px; }
  .badan-haiwan{ width:90px; height:85px; border-radius:32px; top:70px; left:50%; margin-left:-45px; }
  .sayap-haiwan{ width:42px; height:60px; border-radius:16px; top:80px; left:15px; }
  .ekor-haiwan{ width:42px; height:55px; border-radius:16px; top:90px; left:165px; }
  .kaki-haiwan{ width:60px; height:60px; border-radius:14px; top:200px; left:50%; margin-left:-30px; }

  /* Bahagian Tumbuhan (Tahun 1) */
  .bunga-tumbuhan{ width:60px; height:55px; border-radius:50%; top:0; left:50%; margin-left:-30px; }
  .batang-tumbuhan{ width:24px; height:135px; border-radius:10px; top:60px; left:50%; margin-left:-12px; }
  .daun-tumbuhan{ width:50px; height:35px; border-radius:16px; top:70px; left:150px; }
  .akar-tumbuhan{ width:90px; height:70px; border-radius:20px; top:200px; left:50%; margin-left:-45px; }

  /* Uji Kajian Bayang (Tahun 2) */
  .cahaya{ width:50px; height:50px; border-radius:50%; top:110px; left:10px; }
  .objek{ width:24px; height:40px; border-radius:6px; top:115px; left:90px; }
  .bayang{ width:50px; height:20px; border-radius:6px; top:125px; left:130px; }
  .skrin{ width:20px; height:90px; border-radius:4px; top:90px; left:190px; }

  /* Bahagian Bunga (Tahun 2) */
  .mahkota{ width:100px; height:100px; border-radius:50%; top:0; left:50%; margin-left:-50px; }
  .putik{ width:30px; height:30px; border-radius:50%; top:35px; left:50%; margin-left:-15px; }
  .kelopak-bunga{ width:70px; height:20px; border-radius:8px; top:95px; left:50%; margin-left:-35px; }
  .tangkai-bunga{ width:20px; height:150px; border-radius:8px; top:115px; left:50%; margin-left:-10px; }

  /* Bahagian Ikan (Tahun 3) */
  .kepala-ikan{ width:60px; height:50px; border-radius:50%; top:100px; left:10px; }
  .badan-ikan{ width:90px; height:70px; border-radius:28px; top:90px; left:70px; }
  .sirip-ikan{ width:50px; height:30px; border-radius:10px; top:60px; left:100px; }
  .ekor-ikan{ width:45px; height:40px; border-radius:10px; top:110px; left:165px; }

  /* Litar Elektrik Ringkas (Tahun 4) */
  .bateri{ width:60px; height:30px; border-radius:8px; top:40px; left:20px; }
  .wayar{ width:80px; height:15px; border-radius:6px; top:20px; left:90px; }
  .mentol{ width:40px; height:40px; border-radius:50%; top:40px; left:160px; }
  .suis{ width:60px; height:25px; border-radius:8px; top:200px; left:80px; }

  /* Kitaran Hidup Rama-rama (Tahun 5) */
  .telur-kitaran{ width:60px; height:40px; border-radius:16px; top:10px; left:50%; margin-left:-30px; }
  .ulat-kitaran{ width:60px; height:40px; border-radius:16px; top:100px; left:150px; }
  .kepompong-kitaran{ width:60px; height:40px; border-radius:16px; top:220px; left:50%; margin-left:-30px; }
  .ramarama-kitaran{ width:60px; height:60px; border-radius:16px; top:100px; left:10px; }

  /* Piramid Tenaga Ekosistem (Tahun 6) */
  .pengguna-tertier{ width:60px; height:50px; border-radius:10px; top:0; left:50%; margin-left:-30px; }
  .pengguna-sekunder{ width:100px; height:55px; border-radius:10px; top:60px; left:50%; margin-left:-50px; }
  .pengguna-primer{ width:140px; height:60px; border-radius:10px; top:125px; left:50%; margin-left:-70px; }
  .pengeluar{ width:180px; height:65px; border-radius:10px; top:195px; left:50%; margin-left:-90px; }

  /* Bahagian Telur (Tahun 2) */
  .cangkerang-telur{ width:140px; height:70px; border-radius:50%; top:20px; left:50%; margin-left:-70px; }
  .putih-telur{ width:100px; height:50px; border-radius:50%; top:110px; left:50%; margin-left:-50px; }
  .kuning-telur{ width:60px; height:60px; border-radius:50%; top:180px; left:50%; margin-left:-30px; }

  /* Bahagian Katak (Tahun 3) */
  .kepala-katak{ width:56px; height:50px; border-radius:50%; top:10px; left:50%; margin-left:-28px; }
  .badan-katak{ width:90px; height:80px; border-radius:30px; top:65px; left:50%; margin-left:-45px; }
  .kakidepan-katak{ width:40px; height:50px; border-radius:14px; top:80px; left:15px; }
  .kakibelakang-katak{ width:55px; height:70px; border-radius:16px; top:150px; left:50%; margin-left:-27px; }

  /* Rantai Makanan Mudah (Tahun 4) */
  .matahari-rantai{ width:60px; height:55px; border-radius:50%; top:0; left:50%; margin-left:-30px; }
  .tumbuhan-rantai{ width:60px; height:55px; border-radius:12px; top:75px; left:50%; margin-left:-30px; }
  .herbivor-rantai{ width:60px; height:55px; border-radius:12px; top:150px; left:50%; margin-left:-30px; }
  .karnivor-rantai{ width:60px; height:55px; border-radius:12px; top:225px; left:50%; margin-left:-30px; }

  /* Turbin Angin (Tahun 5) */
  .bilah-turbin{ width:140px; height:35px; border-radius:16px; top:10px; left:50%; margin-left:-70px; }
  .hab-turbin{ width:30px; height:30px; border-radius:50%; top:50px; left:50%; margin-left:-15px; }
  .tiang-turbin{ width:18px; height:150px; border-radius:8px; top:85px; left:50%; margin-left:-9px; }
  .asas-turbin{ width:70px; height:25px; border-radius:8px; top:240px; left:50%; margin-left:-35px; }

  /* Panel Solar (Tahun 6) */
  .panel-solar{ width:160px; height:70px; border-radius:10px; top:20px; left:50%; margin-left:-80px; }
  .tiang-solar{ width:16px; height:100px; border-radius:6px; top:90px; left:50%; margin-left:-8px; }
  .pendawaian-solar{ width:70px; height:16px; border-radius:6px; top:195px; left:30px; }
  .inverter-solar{ width:60px; height:45px; border-radius:8px; top:220px; left:50%; margin-left:-30px; }

  /* chip tray */
  #tray{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; flex-shrink:0; z-index:2; margin-bottom:env(safe-area-inset-bottom, 8px); min-height:52px; }
  .chip{
    background:var(--cream); color:var(--navy);
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    padding:12px 18px; border-radius:20px;
    box-shadow:0 6px 0 rgba(27,51,88,0.25), 0 8px 14px rgba(0,0,0,0.2);
    cursor:grab; touch-action:none; position:relative;
    transition: box-shadow 0.15s;

  .chip:active{ cursor:grabbing; }
  .chip.dragging{ box-shadow:0 3px 0 rgba(27,51,88,0.25), 0 16px 24px rgba(0,0,0,0.3); z-index:40; }

  #toast{

    padding:8px 18px; border-radius:30px; z-index:60; opacity:0;

  }
  #toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

  .confetti{ position:fixed; top:-10px; width:10px;height:10px; border-radius:2px; z-index:50; pointer-events:none; }

  #win-screen{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at top, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    z-index:100; text-align:center; color:#fff; font-family:'Baloo 2', sans-serif;
  }
  #win-screen.show{ display:flex; }
  #win-screen .big-emoji{ font-size:70px; animation: cheer 0.8s cubic-bezier(.34,1.56,.64,1); }
  #win-screen h2{ font-size:26px; margin:10px 0 4px; text-shadow:0 3px 0 rgba(27,51,88,0.35); }
  #win-screen p{ font-family:'Nunito',sans-serif; font-weight:700; opacity:0.9; margin:0 0 20px;}
  #replay-btn, #back-btn{
    background:var(--sun); color:var(--navy); border:none;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px;
    padding:12px 28px; border-radius:30px; box-shadow:0 6px 0 #E0AC1F; cursor:pointer; margin:4px;
  }
  #replay-btn:active, #back-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #E0AC1F; }
  #back-btn{ background:#EAF6FC; color:var(--sky-deep); box-shadow:0 6px 0 #CFE7F2; }
  #back-btn:active{ box-shadow:0 2px 0 #CFE7F2; }
</style>

<script>
const params = new URLSearchParams(location.search);
const topikKey = params.get('topik');

let zones = [];
let filledCount = 0;
let topicData = null;
let resolvedTopik = null;

const progressWrap = document.getElementById('progress-wrap');
const mascot = document.getElementById('mascot');
const pupilL = document.getElementById('pupilL');
const pupilR = document.getElementById('pupilR');
const speech = document.getElementById('speech');
const toast = document.getElementById('toast');
const winScreen = document.getElementById('win-screen');
const winScore = document.getElementById('win-score');
const topikTitle = document.getElementById('topik-title');
const bodyDiagram = document.getElementById('body-diagram');
const tray = document.getElementById('tray');

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

async function loadTopic(){
  const res = await fetch('data/label-rajah-questions.json');
  const bank = await res.json();
  const keys = Object.keys(bank);
  const key = (topikKey && bank[topikKey]) ? topikKey : keys[0];
  resolvedTopik = key;
  topicData = bank[key] || bank[keys[0]];

  document.title = `Seronok Sains — ${topicData.topikLabel}`;
  topikTitle.textContent = `${topicData.topikLabel} — Tahun ${topicData.tahun}`;

  zones = topicData.zones;
  filledCount = 0;

  bodyDiagram.innerHTML = '';
  (topicData.decor || []).forEach(shape => {
    const el = document.createElement('div');
    el.className = `decor ${shape}`;
    bodyDiagram.appendChild(el);
  });
  zones.forEach(z => {
    const el = document.createElement('div');
    el.className = `zone ${z.shape}`;
    el.dataset.zone = z.id;
    el.textContent = '?';
    bodyDiagram.appendChild(el);
  });

  progressWrap.innerHTML = '';
  zones.forEach(() => {
    const s = document.createElement('div');
    s.className='star';
    s.innerHTML = starSVG(false);
    progressWrap.appendChild(s);
  });

  renderTray();
}

function renderTray(){
  tray.innerHTML = '';
  const remaining = zones.filter(z => !document.querySelector(`.zone[data-zone="${z.id}"]`).classList.contains('filled'));
  shuffle([...remaining]).forEach(z => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = z.label;
    chip.dataset.target = z.id;
    attachDrag(chip);
    tray.appendChild(chip);
  });
}

function starSVG(filled){
  return `<svg viewBox="0 0 24 24"><path d="M12 1l3.2 6.9L22 9l-5 5.1L18.4 22 12 18.3 5.6 22 7 14.1 2 9l6.8-1.1z" fill="${filled? '#FFD23F':'rgba(255,255,255,0.35)'}" stroke="#fff" stroke-width="1"/></svg>`;
}

function say(text, ms=1400){
  speech.textContent = text;
  speech.classList.add('show');
  clearTimeout(say._t);
  say._t = setTimeout(()=> speech.classList.remove('show'), ms);
}

function playTone(freqs, dur=0.12, type='sine'){
  try{
    const ctx = playTone._ctx || (playTone._ctx = new (window.AudioContext||window.webkitAudioContext)());
    let t = ctx.currentTime;
    freqs.forEach((f)=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+dur+0.02);
      t += dur*0.55;
    });
  }catch(e){}
}

function confettiBurst(x,y){
  const colors = ['#FFD23F','#4ECB71','#29ABE2','#FF6B6B','#fff'];
  for(let i=0;i<24;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.left = x+'px';
    c.style.top = y+'px';
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*120;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 80;
    const rot = Math.random()*720-360;
    document.body.appendChild(c);
    c.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px, ${dy+220}px) rotate(${rot}deg)`, opacity:0}
    ], {duration: 900+Math.random()*400, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = ()=> c.remove();
  }
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 900);
}

function handleDrop(chip, zoneEl, isCorrect){
  if(isCorrect){
    const rect = zoneEl.getBoundingClientRect();
    zoneEl.classList.add('filled', 'correct-flash');
    zoneEl.textContent = zoneEl.dataset.zone ? zones.find(z=>z.id===zoneEl.dataset.zone).label : '';
    setTimeout(()=>zoneEl.classList.remove('correct-flash'), 500);
    confettiBurst(rect.left+rect.width/2, rect.top+rect.height/2);
    playTone([523.25, 659.25, 783.99], 0.14);
    mascot.classList.remove('idle'); mascot.classList.add('happy');
    pupilL.setAttribute('r','9'); pupilR.setAttribute('r','9');
    const praises = ['Bagus!','Betul tu!','Hebat!','Pandai!','Yes!'];
    say(praises[Math.floor(Math.random()*praises.length)]);
    showToast('✅ Betul!');
    filledCount++;
    const starEls = progressWrap.children;
    starEls[filledCount-1].innerHTML = starSVG(true);
    starEls[filledCount-1].classList.add('filled');
    setTimeout(()=>{
      mascot.classList.remove('happy'); mascot.classList.add('idle');
      pupilL.setAttribute('r','7'); pupilR.setAttribute('r','7');
    }, 600);
    chip.remove();
    if(filledCount >= zones.length){
      setTimeout(showWin, 700);
    }
  } else {
    if(zoneEl){
      zoneEl.classList.add('wrong-flash');
      setTimeout(()=>zoneEl.classList.remove('wrong-flash'), 400);
    }
    playTone([220, 196], 0.16, 'triangle');
    mascot.classList.remove('idle'); mascot.classList.add('oops');
    pupilL.setAttribute('r','5'); pupilR.setAttribute('r','5');
    const hints = ['Cuba lagi!','Hampir!','Fikir sekali lagi'];
    say(hints[Math.floor(Math.random()*hints.length)]);
    showToast('Cuba lagi ya 💪');
    setTimeout(()=>{
      mascot.classList.remove('oops'); mascot.classList.add('idle');
      pupilL.setAttribute('r','7'); pupilR.setAttribute('r','7');
    }, 550);
  }
}

function showWin(){
  writeProgress('label-rajah', resolvedTopik, topicData.topikLabel, zones.length, zones.length);
  winScore.textContent = `Skor: ${zones.length}/${zones.length}`;
  winScreen.classList.add('show');
  confettiBurst(window.innerWidth/2, window.innerHeight*0.35);
  setTimeout(()=>confettiBurst(window.innerWidth*0.3, window.innerHeight*0.3), 200);
  setTimeout(()=>confettiBurst(window.innerWidth*0.7, window.innerHeight*0.3), 400);
  playTone([523.25,659.25,783.99,1046.5], 0.16);
}

document.getElementById('replay-btn').addEventListener('click', ()=>{
  document.querySelectorAll('.zone').forEach(z => { z.classList.remove('filled'); z.textContent = '?'; });
  [...progressWrap.children].forEach(s=> s.innerHTML = starSVG(false));

  winScreen.classList.remove('show');
  renderTray();
});
document.getElementById('back-btn').addEventListener('click', ()=>{

});

function attachDrag(chip){
  let dragging = false;
  let offsetX=0, offsetY=0;

  chip.addEventListener('pointerdown', (e)=>{
    dragging = true;
    try{ chip.setPointerCapture(e.pointerId); }catch(err){}
    chip.classList.add('dragging');
    const rect = chip.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    chip.style.position='fixed';
    chip.style.left = rect.left+'px';
    chip.style.top = rect.top+'px';
    chip.style.width = rect.width+'px';
  });

  chip.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    chip.style.left = (e.clientX - offsetX)+'px';
    chip.style.top = (e.clientY - offsetY)+'px';
    const cardRect = chip.getBoundingClientRect();
    const cx = cardRect.left + cardRect.width/2;
    const cy = cardRect.top + cardRect.height/2;
    document.querySelectorAll('.zone').forEach(zoneEl=>{
      if(zoneEl.classList.contains('filled')) return;
      const r = zoneEl.getBoundingClientRect();
      const over = cx > r.left && cx < r.right && cy > r.top && cy < r.bottom;
      zoneEl.classList.toggle('hover', over);
    });
  });

  chip.addEventListener('pointerup', (e)=>{
    if(!dragging) return;
    dragging = false;
    chip.classList.remove('dragging');
    const cardRect = chip.getBoundingClientRect();
    const cx = cardRect.left + cardRect.width/2;
    const cy = cardRect.top + cardRect.height/2;
    let landed = null;
    document.querySelectorAll('.zone').forEach(zoneEl=>{
      zoneEl.classList.remove('hover');
      if(zoneEl.classList.contains('filled')) return;
      const r = zoneEl.getBoundingClientRect();
      const over = cx > r.left && cx < r.right && cy > r.top && cy < r.bottom;
      if(over) landed = zoneEl;
    });
    if(landed){
      const correct = landed.dataset.zone === chip.dataset.target;
      handleDrop(chip, landed, correct);
      if(!correct){
        chip.style.position='relative';
        chip.style.left=''; chip.style.top=''; chip.style.width='';
      }
    } else {
      chip.style.position='relative';
      chip.style.left=''; chip.style.top=''; chip.style.width='';
    }
  });
}

let _pdbFs = null, _pdbMod = null;
async function initProgressDB(){
  try{
    const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const app = appMod.initializeApp(PROGRESS_FIREBASE_CONFIG);

    console.warn('Progress tracking tidak dapat disambung:', e);
  }

function todayLocal(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const BADGE_RULES = [
  { id: 'first-play', check: p => p.totalPlays >= 1 },
  { id: '5-topics', check: p => p.totalPlays >= 5 },
  { id: '20-topics', check: p => p.totalPlays >= 20 },
  { id: '3-day-streak', check: p => p.currentStreak >= 3 },
  { id: '7-day-streak', check: p => p.currentStreak >= 7 },
  { id: 'all-mechanics', check: p => Object.keys(p.mechanicsPlayed||{}).length >= 10 },
  { id: 'perfect-score', check: (p, justPerfect) => justPerfect }
];

async function writeProgress(mechanic, topikKey, topikLabel, score, total){
  try{
    if(!_pdbFs) await initProgressDB();
    if(!_pdbFs) return;
    const raw = sessionStorage.getItem('ss_activeStudent');
    if(!raw) return;
    const student = JSON.parse(raw);
    const { doc, getDoc, setDoc, increment } = _pdbMod;
    const ref = doc(_pdbFs, 'sains_progress', student.id);
    const snap = await getDoc(ref);
    const prev = snap.exists() ? snap.data() : null;

    const today = todayLocal();
    let currentStreak = 1;
    if(prev && prev.lastPlayedDate === today){
      currentStreak = prev.currentStreak || 1;
    } else if(prev){
      const y = new Date(); y.setDate(y.getDate()-1);
      const yesterday = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
      currentStreak = prev.lastPlayedDate === yesterday ? (prev.currentStreak||0)+1 : 1;
    }
    const longestStreak = Math.max(prev?.longestStreak || 0, currentStreak);

    const mechanicsPlayed = { ...(prev?.mechanicsPlayed || {}) };
    mechanicsPlayed[mechanic] = (mechanicsPlayed[mechanic] || 0) + 1;

    const isPerfect = total > 0 && score === total;
    const progressState = { totalPlays: (prev?.totalPlays || 0) + 1, currentStreak, mechanicsPlayed };
    const existingBadges = new Set(prev?.badges || []);
    BADGE_RULES.forEach(b => {
      if(!existingBadges.has(b.id) && b.check(progressState, isPerfect)) existingBadges.add(b.id);
    });

    await setDoc(ref, {
      name: student.namaAnak,
      tahun: student.tahun,
      kelas: student.kelas,
      totalStars: increment(score),
      totalPlays: increment(1),
      mechanicsPlayed: { [mechanic]: increment(1) },
      currentStreak, longestStreak,
      lastPlayedDate: today,
      badges: [...existingBadges],
      updatedAt: today
    }, { merge:true });
  }catch(e){
    console.warn('Gagal menyimpan kemajuan:', e);
  }
}

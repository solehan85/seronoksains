<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Seronok Sains — Post Instagram/Facebook (1080x1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#29ABE2; --sky-deep:#1E8FC4; --sun:#FFD23F; --sun-deep:#E0AC1F;
    --navy:#1B3358; --cream:#FFF6EC;
    --bird-body:#4FC3E0; --bird-wing:#3B9FC4; --bird-beak:#FF9F43;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    width:1080px; height:1080px;
    font-family:'Nunito', sans-serif;
    background: radial-gradient(ellipse 120% 90% at 50% 0%, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    text-align:center; color:#fff;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.18); border:2px solid rgba(255,255,255,0.4);
    padding:12px 28px; border-radius:40px; font-weight:800; font-size:22px;
    margin-bottom:36px;
  }
  #mascot{ width:280px; height:280px; filter:drop-shadow(0 14px 18px rgba(0,0,0,0.25)); margin-bottom:8px; }
  h1{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:64px; line-height:1.15;
    text-shadow:0 5px 0 rgba(27,51,88,0.3); max-width:820px; margin-bottom:22px;
  }
  h1 .hl{ color:var(--sun); }
  p.sub{ font-weight:800; font-size:28px; max-width:760px; opacity:0.95; margin-bottom:44px; }
  .price-pill{
    display:inline-flex; align-items:baseline; gap:14px;
    background:#fff; color:var(--navy); border-radius:36px;
    padding:22px 46px; box-shadow:0 12px 0 rgba(27,51,88,0.2), 0 20px 34px rgba(0,0,0,0.28);
  }
  .price-pill .amt{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:56px; color:var(--sky-deep); }
  .price-pill .note{ font-weight:800; font-size:20px; color:#5C7690; text-align:left; }
  .foot{ position:absolute; bottom:44px; font-weight:800; font-size:20px; opacity:0.85; }
</style>
</head>
<body>
  <span class="eyebrow">🐦 Eduverse by Mosobimo</span>
  <svg id="mascot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="93" rx="24" ry="5" fill="rgba(27,51,88,0.2)"/>
    <path d="M 76 58 L 94 48 L 90 64 Z" fill="var(--bird-wing)"/>
    <path d="M 76 64 L 93 62 L 88 74 Z" fill="var(--bird-wing)"/>
    <path d="M 40 86 L 36 92 M 40 86 L 44 91" stroke="var(--bird-beak)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 60 86 L 56 91 M 60 86 L 64 92" stroke="var(--bird-beak)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 22 50 Q 4 56 10 76 Q 24 74 28 58 Z" fill="var(--bird-wing)"/>
    <path d="M 78 50 Q 96 56 90 76 Q 76 74 72 58 Z" fill="var(--bird-wing)"/>
    <ellipse cx="50" cy="56" rx="28" ry="30" fill="var(--bird-body)"/>
    <ellipse cx="50" cy="64" rx="17" ry="19" fill="var(--cream)"/>
    <path d="M 47 22 Q 50 6 54 21" stroke="var(--bird-wing)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 28 33 Q 38 28 45 33" stroke="var(--bird-wing)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 55 33 Q 62 28 72 33" stroke="var(--bird-wing)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="38" cy="48" r="13" fill="#fff"/>
    <circle cx="62" cy="48" r="13" fill="#fff"/>
    <circle cx="40" cy="49" r="7" fill="var(--navy)"/>
    <circle cx="64" cy="49" r="7" fill="var(--navy)"/>
    <circle cx="43" cy="45" r="2.2" fill="#fff"/>
    <circle cx="67" cy="45" r="2.2" fill="#fff"/>
    <path d="M 45 60 Q 50 55 55 60 Q 50 68 45 60 Z" fill="var(--bird-beak)"/>
  </svg>
  <h1>Sains KSSR jadi <span class="hl">permainan</span></h1>
  <p class="sub">10 mekanik interaktif · Tahun 1–6 · Papan pendahulu &amp; lencana</p>
  <div class="price-pill"><span class="amt">RM39</span><span class="note">sekali bayar<br>guna selamanya</span></div>
  <span class="foot">Seronok Sains — Eduverse by Mosobimo</span>
</body>
</html>

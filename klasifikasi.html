<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seronok Sains — Klasifikasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#29ABE2;
    --sky-deep:#1E8FC4;
    --sun:#FFD23F;
    --grass:#4ECB71;
    --grass-deep:#33A857;
    --coral:#FF6B6B;
    --navy:#1B3358;
    --cream:#FFFFFF;
    --shadow: rgba(27,51,88,0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background: radial-gradient(ellipse at top, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stage{
    width:100%;
    max-width:520px;
    height:100vh;
    max-height:900px;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:18px 16px 10px;
  }

  /* clouds */
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50px;
    opacity:0.55;
    filter:blur(0.5px);
    animation: drift 40s linear infinite;
  }
  .cloud::before, .cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}
  .c1{width:90px;height:32px;top:6%;left:-20%;}
  .c1::before{width:50px;height:50px;top:-22px;left:10px;}
  .c1::after{width:40px;height:40px;top:-16px;left:45px;}
  .c2{width:70px;height:26px;top:16%;left:-30%;animation-duration:55s; animation-delay:-15s;}
  .c2::before{width:38px;height:38px;top:-16px;left:6px;}
  .c2::after{width:32px;height:32px;top:-12px;left:32px;}
  @keyframes drift{ from{transform:translateX(0);} to{transform:translateX(160vw);} }

  header{
    text-align:center;
    color:#fff;
    flex-shrink:0;
    z-index:2;
  }
  header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:22px;
    margin:0;
    text-shadow:0 3px 0 rgba(27,51,88,0.35);
    letter-spacing:0.5px;
  }
  header p{
    margin:2px 0 0;
    font-weight:600;
    font-size:13px;
    opacity:0.9;
  }

  /* progress */
  #progress-wrap{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:12px 0 6px;
    z-index:2;
  }
  .star{
    width:30px; height:30px;
    position:relative;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .star svg{width:100%;height:100%;}
  .star.filled{ animation: starPop 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes starPop{
    0%{transform:scale(0.3) rotate(-20deg);}
    60%{transform:scale(1.3) rotate(8deg);}
    100%{transform:scale(1) rotate(0deg);}
  }

  /* mascot */
  #mascot-zone{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:130px;
    z-index:2;
    position:relative;
  }
  #mascot{
    width:100px;
    height:100px;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.2));
    transform-box: fill-box;
    transform-origin: center;
  }
  #mascot.idle{ animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-8px) rotate(2deg);} }
  #mascot.happy{ animation: cheer 0.6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes cheer{
    0%{transform:scale(1) rotate(0);}
    30%{transform:scale(1.25) rotate(-8deg) translateY(-14px);}
    55%{transform:scale(1.1) rotate(8deg) translateY(-6px);}
    100%{transform:scale(1) rotate(0);}
  }
  #mascot.oops{ animation: sad 0.55s ease-in-out; }
  @keyframes sad{
    0%,100%{transform:translateY(0) rotate(0);}
    30%{transform:translateY(4px) rotate(-6deg);}
    60%{transform:translateY(4px) rotate(6deg);}
  }
  .wing{ transform-box: fill-box; transform-origin: top center; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); }
  #mascot.happy .wing-l{ transform: rotate(-55deg) translateY(-6px); }
  #mascot.happy .wing-r{ transform: rotate(55deg) translateY(-6px); }
  #mascot.idle .wing-l, #mascot.idle .wing-r{ animation: flap 2.6s ease-in-out infinite; }
  #mascot.idle .wing-r{ animation-delay: -1.3s; }
  @keyframes flap{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-6deg);} }
  #mascot.oops .wing-l{ transform: rotate(10deg); }
  #mascot.oops .wing-r{ transform: rotate(-10deg); }
  .brow{ transform-box: fill-box; transform-origin: center; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); }
  #mascot.happy .brow-l{ transform: translateY(-3px) rotate(-8deg); }
  #mascot.happy .brow-r{ transform: translateY(-3px) rotate(8deg); }
  #mascot.oops .brow-l{ transform: translateY(2px) rotate(14deg); }
  #mascot.oops .brow-r{ transform: translateY(2px) rotate(-14deg); }

  #speech{
    position:absolute;
    top:-6px;
    left:50%;
    background:#fff;
    color:var(--navy);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:6px 14px;
    border-radius:20px;
    box-shadow:0 4px 0 rgba(0,0,0,0.1);
    opacity:0;
    transform:translate(-50%, 6px) scale(0.9);
    transition: all 0.3s cubic-bezier(.34,1.56,.64,1);
    white-space:nowrap;
    z-index:5;
  }
  #speech::after{
    content:'';
    position:absolute;
    bottom:-7px; left:50%;
    transform:translateX(-50%);
    border:7px solid transparent;
    border-top-color:#fff;
  }
  #speech.show{opacity:1; transform:translate(-50%, 0) scale(1);}

  /* card area */
  #card-zone{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:3;
    min-height:0;
  }
  #item-card{
    width:150px;
    height:150px;
    background:var(--cream);
    border-radius:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:76px;
    box-shadow:0 10px 0 rgba(27,51,88,0.25), 0 14px 24px rgba(0,0,0,0.25);
    cursor:grab;
    touch-action:none;
    position:relative;
    transition: box-shadow 0.15s;
  }
  #item-card:active{cursor:grabbing;}
  #item-card.dragging{
    box-shadow:0 4px 0 rgba(27,51,88,0.25), 0 24px 34px rgba(0,0,0,0.3);
  }
  #item-card.enter{ animation: cardIn 0.45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes cardIn{
    0%{transform: scale(0.3) rotate(-15deg); opacity:0;}
    70%{transform: scale(1.12) rotate(4deg); opacity:1;}
    100%{transform: scale(1) rotate(0);}
  }
  #item-label{
    position:absolute;
    bottom:-30px;
    left:0; right:0;
    text-align:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    color:#fff;
    font-size:15px;
    text-shadow:0 2px 0 rgba(27,51,88,0.4);
  }

  /* bins */
  #bins{
    display:flex;
    gap:14px;
    flex-shrink:0;
    z-index:2;
    margin-bottom:env(safe-area-inset-bottom, 8px);
  }
  .bin{
    flex:1;
    height:110px;
    border-radius:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:#fff;
    font-size:16px;
    gap:4px;
    border:4px dashed rgba(255,255,255,0.6);
    transition: all 0.2s cubic-bezier(.34,1.56,.64,1);
    box-shadow: inset 0 -6px 14px rgba(0,0,0,0.12);
  }
  .bin .emoji{font-size:32px; transition:transform 0.2s;}
  .bin.bin-a{ background: linear-gradient(160deg, var(--grass), var(--grass-deep)); }
  .bin.bin-b{ background: linear-gradient(160deg, #6C7A93, #47536B); }
  .bin.hover{
    transform: scale(1.06);
    border-color:#fff;
    box-shadow: inset 0 -6px 14px rgba(0,0,0,0.12), 0 0 0 6px rgba(255,255,255,0.35);
  }
  .bin.correct-flash{ animation: binYes 0.5s ease; }
  @keyframes binYes{
    0%{filter:brightness(1);}
    40%{filter:brightness(1.5);}
    100%{filter:brightness(1);}
  }
  .bin.wrong-flash{ animation: binNo 0.4s ease; }
  @keyframes binNo{
    0%,100%{transform:translateX(0) scale(1);}
    25%{transform:translateX(-6px) scale(1);}
    75%{transform:translateX(6px) scale(1);}
  }

  /* confetti */
  .confetti{
    position:fixed;
    top:-10px;
    width:10px;height:10px;
    border-radius:2px;
    z-index:50;
    pointer-events:none;
  }

  #toast{
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%) translateY(-40px);
    background:var(--navy);
    color:#fff;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:8px 18px;
    border-radius:30px;
    z-index:60;
    opacity:0;
    transition: all 0.4s cubic-bezier(.34,1.56,.64,1);
    white-space:nowrap;
  }
  #toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

  #win-screen{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at top, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:100;
    text-align:center;
    color:#fff;
    font-family:'Baloo 2', sans-serif;
  }
  #win-screen.show{ display:flex; }
  #win-screen .big-emoji{ font-size:70px; animation: cheer 0.8s cubic-bezier(.34,1.56,.64,1); }
  #win-screen h2{ font-size:26px; margin:10px 0 4px; text-shadow:0 3px 0 rgba(27,51,88,0.35); }
  #win-screen p{ font-family:'Nunito',sans-serif; font-weight:700; opacity:0.9; margin:0 0 20px;}
  #replay-btn, #back-btn{
    background:var(--sun);
    color:var(--navy);
    border:none;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:12px 28px;
    border-radius:30px;
    box-shadow:0 6px 0 #E0AC1F;
    cursor:pointer;
    margin:4px;
  }
  #replay-btn:active, #back-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #E0AC1F; }
  #back-btn{ background:#EAF6FC; color:var(--sky-deep); box-shadow:0 6px 0 #CFE7F2; }
  #back-btn:active{ box-shadow:0 2px 0 #CFE7F2; }
</style>
</head>
<body>
<div id="stage">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <header>
    <h1>🔬 Seronok Sains</h1>
    <p id="topik-title">Memuatkan...</p>
  </header>

  <div id="progress-wrap"></div>

  <div id="mascot-zone">
    <svg id="mascot" class="idle" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="93" rx="24" ry="5" fill="rgba(27,51,88,0.2)"/>
      <path d="M 76 58 L 94 48 L 90 64 Z" fill="#3B9FC4"/>
      <path d="M 76 64 L 93 62 L 88 74 Z" fill="#3B9FC4"/>
      <path d="M 40 86 L 36 92 M 40 86 L 44 91" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M 60 86 L 56 91 M 60 86 L 64 92" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path class="wing wing-l" d="M 22 50 Q 4 56 10 76 Q 24 74 28 58 Z" fill="#3B9FC4"/>
      <path class="wing wing-r" d="M 78 50 Q 96 56 90 76 Q 76 74 72 58 Z" fill="#3B9FC4"/>
      <ellipse cx="50" cy="56" rx="28" ry="30" fill="#4FC3E0"/>
      <ellipse cx="50" cy="64" rx="17" ry="19" fill="#FFF6EC"/>
      <path d="M 47 22 Q 50 6 54 21" stroke="#3B9FC4" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path class="brow brow-l" d="M 28 33 Q 38 28 45 33" stroke="#3B9FC4" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path class="brow brow-r" d="M 55 33 Q 62 28 72 33" stroke="#3B9FC4" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="38" cy="48" r="13" fill="#fff"/>
      <circle cx="62" cy="48" r="13" fill="#fff"/>
      <circle id="pupilL" cx="40" cy="49" r="7" fill="#1B3358"/>
      <circle id="pupilR" cx="64" cy="49" r="7" fill="#1B3358"/>
      <circle cx="43" cy="45" r="2.2" fill="#fff"/>
      <circle cx="67" cy="45" r="2.2" fill="#fff"/>
      <path d="M 45 60 Q 50 55 55 60 Q 50 68 45 60 Z" fill="#FF9F43"/>
    </svg>
    <div id="speech"></div>
  </div>

  <div id="card-zone">
    <div id="item-card">
      <span id="item-emoji">🐱</span>
      <span id="item-label">Kucing</span>
    </div>
  </div>

  <div id="bins">
    <div class="bin bin-a" id="bin-a" data-type="">
      <span class="emoji" id="bin-a-emoji"></span>
      <span id="bin-a-label"></span>
    </div>
    <div class="bin bin-b" id="bin-b" data-type="">
      <span class="emoji" id="bin-b-emoji"></span>
      <span id="bin-b-label"></span>
    </div>
  </div>

  <div id="toast"></div>

  <div id="win-screen">
    <div class="big-emoji">🏆</div>
    <h2>Hebat! Set Selesai!</h2>
    <p id="win-score">Skor: 8/8</p>
    <div>
      <button id="replay-btn">Main Lagi</button>
      <button id="back-btn">Menu</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const topikKey = params.get('topik');

let items = [];
let order = [];
let idx = 0;
let score = 0;
let topicData = null;
let resolvedTopik = null;

const progressWrap = document.getElementById('progress-wrap');
const mascot = document.getElementById('mascot');
const pupilL = document.getElementById('pupilL');
const pupilR = document.getElementById('pupilR');
const speech = document.getElementById('speech');
const cardZone = document.getElementById('card-zone');
const itemCard = document.getElementById('item-card');
const itemEmoji = document.getElementById('item-emoji');
const itemLabel = document.getElementById('item-label');
const toast = document.getElementById('toast');
const winScreen = document.getElementById('win-screen');
const winScore = document.getElementById('win-score');
const topikTitle = document.getElementById('topik-title');
const binA = document.getElementById('bin-a');
const binB = document.getElementById('bin-b');
let bins;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

async function loadTopic(){
  const res = await fetch('data/klasifikasi-questions.json');
  const bank = await res.json();
  const keys = Object.keys(bank);
  const key = (topikKey && bank[topikKey]) ? topikKey : keys[0];
  resolvedTopik = key;
  topicData = bank[key];

  document.title = `Seronok Sains — ${topicData.topikLabel}`;
  topikTitle.textContent = `${topicData.topikLabel} — Tahun ${topicData.tahun}`;

  binA.dataset.type = topicData.binA.type;
  document.getElementById('bin-a-emoji').textContent = topicData.binA.emoji;
  document.getElementById('bin-a-label').textContent = topicData.binA.label;
  binB.dataset.type = topicData.binB.type;
  document.getElementById('bin-b-emoji').textContent = topicData.binB.emoji;
  document.getElementById('bin-b-label').textContent = topicData.binB.label;
  bins = document.querySelectorAll('.bin');

  const setIdx = Math.floor(Math.random() * topicData.sets.length);
  items = topicData.sets[setIdx];

  order = shuffle([...items]);
  idx = 0; score = 0;

  progressWrap.innerHTML = '';
  for(let i=0;i<items.length;i++){
    const s = document.createElement('div');
    s.className='star';
    s.innerHTML = starSVG(false);
    progressWrap.appendChild(s);
  }

  attachBinDropHandlers();
  loadCard();
}

function starSVG(filled){
  return `<svg viewBox="0 0 24 24"><path d="M12 1l3.2 6.9L22 9l-5 5.1L18.4 22 12 18.3 5.6 22 7 14.1 2 9l6.8-1.1z" fill="${filled? '#FFD23F':'rgba(255,255,255,0.35)'}" stroke="#fff" stroke-width="1"/></svg>`;
}

function say(text, ms=1400){
  speech.textContent = text;
  speech.classList.add('show');
  clearTimeout(say._t);
  say._t = setTimeout(()=> speech.classList.remove('show'), ms);
}

function loadCard(){
  const current = order[idx];
  itemEmoji.textContent = current.emoji;
  itemLabel.textContent = current.label;
  itemCard.style.transform = '';
  itemCard.style.left = '';
  itemCard.style.top = '';
  itemCard.style.position = 'relative';
  itemCard.classList.remove('enter');
  void itemCard.offsetWidth;
  itemCard.classList.add('enter');
}

function playTone(freqs, dur=0.12, type='sine'){
  try{
    const ctx = playTone._ctx || (playTone._ctx = new (window.AudioContext||window.webkitAudioContext)());
    let t = ctx.currentTime;
    freqs.forEach((f,i)=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+dur+0.02);
      t += dur*0.55;
    });
  }catch(e){}
}

function confettiBurst(x,y){
  const colors = ['#FFD23F','#4ECB71','#29ABE2','#FF6B6B','#fff'];
  for(let i=0;i<24;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.left = x+'px';
    c.style.top = y+'px';
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*120;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 80;
    const rot = Math.random()*720-360;
    document.body.appendChild(c);
    c.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px, ${dy+220}px) rotate(${rot}deg)`, opacity:0}
    ], {duration: 900+Math.random()*400, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = ()=> c.remove();
  }
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 900);
}

function handleAnswer(binEl, isCorrect){
  const rect = binEl.getBoundingClientRect();
  if(isCorrect){
    score++;
    binEl.classList.add('correct-flash');
    setTimeout(()=>binEl.classList.remove('correct-flash'), 500);
    confettiBurst(rect.left+rect.width/2, rect.top+rect.height/2);
    playTone([523.25, 659.25, 783.99], 0.14);
    mascot.classList.remove('idle'); mascot.classList.add('happy');
    pupilL.setAttribute('r','9'); pupilR.setAttribute('r','9');
    const praises = ['Bagus!','Betul tu!','Hebat!','Pandai!','Yes!'];
    say(praises[Math.floor(Math.random()*praises.length)]);
    showToast('✅ Betul!');
    const starEls = progressWrap.children;
    starEls[score-1].innerHTML = starSVG(true);
    starEls[score-1].classList.add('filled');
    setTimeout(()=>{
      mascot.classList.remove('happy'); mascot.classList.add('idle');
      pupilL.setAttribute('r','7'); pupilR.setAttribute('r','7');
    }, 600);
    idx++;
    if(idx >= order.length){
      setTimeout(showWin, 700);
    } else {
      setTimeout(loadCard, 500);
    }
  } else {
    binEl.classList.add('wrong-flash');
    setTimeout(()=>binEl.classList.remove('wrong-flash'), 400);
    playTone([220, 196], 0.16, 'triangle');
    mascot.classList.remove('idle'); mascot.classList.add('oops');
    pupilL.setAttribute('r','5'); pupilR.setAttribute('r','5');
    const hints = ['Cuba lagi!','Hampir!','Fikir sekali lagi'];
    say(hints[Math.floor(Math.random()*hints.length)]);
    showToast('Cuba lagi ya 💪');
    setTimeout(()=>{
      mascot.classList.remove('oops'); mascot.classList.add('idle');
      pupilL.setAttribute('r','7'); pupilR.setAttribute('r','7');
    }, 550);
  }
}

function showWin(){
  writeProgress('klasifikasi', resolvedTopik, topicData.topikLabel, score, order.length);
  winScore.textContent = `Skor: ${score}/${order.length}`;
  winScreen.classList.add('show');
  confettiBurst(window.innerWidth/2, window.innerHeight*0.35);
  setTimeout(()=>confettiBurst(window.innerWidth*0.3, window.innerHeight*0.3), 200);
  setTimeout(()=>confettiBurst(window.innerWidth*0.7, window.innerHeight*0.3), 400);
  playTone([523.25,659.25,783.99,1046.5], 0.16);
}

// Drag logic (pointer events — works for mouse + touch)
let dragging = false;
let offsetX=0, offsetY=0, startX=0, startY=0;

itemCard.addEventListener('pointerdown', (e)=>{
  dragging = true;
  try{ itemCard.setPointerCapture(e.pointerId); }catch(err){}
  itemCard.classList.add('dragging');
  const rect = itemCard.getBoundingClientRect();
  startX = rect.left; startY = rect.top;
  offsetX = e.clientX - rect.left;
  offsetY = e.clientY - rect.top;
  itemCard.style.position='fixed';
  itemCard.style.left = rect.left+'px';
  itemCard.style.top = rect.top+'px';
  itemCard.style.zIndex = 40;
  itemCard.style.width = rect.width+'px';
});

itemCard.addEventListener('pointermove', (e)=>{
  if(!dragging) return;
  const x = e.clientX - offsetX;
  const y = e.clientY - offsetY;
  itemCard.style.left = x+'px';
  itemCard.style.top = y+'px';
  const cardRect = itemCard.getBoundingClientRect();
  const cx = cardRect.left + cardRect.width/2;
  const cy = cardRect.top + cardRect.height/2;
  bins.forEach(bin=>{
    const r = bin.getBoundingClientRect();
    const over = cx > r.left && cx < r.right && cy > r.top && cy < r.bottom;
    bin.classList.toggle('hover', over);
  });
});

function attachBinDropHandlers(){
  itemCard.addEventListener('pointerup', (e)=>{
    if(!dragging) return;
    dragging = false;
    itemCard.classList.remove('dragging');
    const cardRect = itemCard.getBoundingClientRect();
    const cx = cardRect.left + cardRect.width/2;
    const cy = cardRect.top + cardRect.height/2;
    let landed = null;
    bins.forEach(bin=>{
      const r = bin.getBoundingClientRect();
      const over = cx > r.left && cx < r.right && cy > r.top && cy < r.bottom;
      bin.classList.remove('hover');
      if(over) landed = bin;
    });
    if(landed){
      const correct = landed.dataset.type === order[idx].type;
      handleAnswer(landed, correct);
      if(!correct){
        itemCard.style.position='relative';
        itemCard.style.left=''; itemCard.style.top='';
        itemCard.style.width='';
      }
    } else {
      itemCard.style.position='relative';
      itemCard.style.left=''; itemCard.style.top='';
      itemCard.style.width='';
    }
  });
}

async function initProgressDB(){

function todayLocal(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const BADGE_RULES = [
  { id: 'first-play', check: p => p.totalPlays >= 1 },
  { id: '5-topics', check: p => p.totalPlays >= 5 },
  { id: '20-topics', check: p => p.totalPlays >= 20 },
  { id: '3-day-streak', check: p => p.currentStreak >= 3 },
  { id: '7-day-streak', check: p => p.currentStreak >= 7 },
  { id: 'all-mechanics', check: p => Object.keys(p.mechanicsPlayed||{}).length >= 10 },
  { id: 'perfect-score', check: (p, justPerfect) => justPerfect }
];

async function writeProgress(mechanic, topikKey, topikLabel, score, total){
  try{
    if(!_pdbFs) await initProgressDB();
    if(!_pdbFs) return;
    const raw = sessionStorage.getItem('ss_activeStudent');
    if(!raw) return;
    const student = JSON.parse(raw);
    const { doc, getDoc, setDoc, increment } = _pdbMod;
    const ref = doc(_pdbFs, 'sains_progress', student.id);
    const snap = await getDoc(ref);
    const prev = snap.exists() ? snap.data() : null;

    const today = todayLocal();
    let currentStreak = 1;
    if(prev && prev.lastPlayedDate === today){
      currentStreak = prev.currentStreak || 1;
    } else if(prev){
      const y = new Date(); y.setDate(y.getDate()-1);
      const yesterday = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
      currentStreak = prev.lastPlayedDate === yesterday ? (prev.currentStreak||0)+1 : 1;
    }
    const longestStreak = Math.max(prev?.longestStreak || 0, currentStreak);

    const mechanicsPlayed = { ...(prev?.mechanicsPlayed || {}) };
    mechanicsPlayed[mechanic] = (mechanicsPlayed[mechanic] || 0) + 1;

    const isPerfect = total > 0 && score === total;
    const progressState = { totalPlays: (prev?.totalPlays || 0) + 1, currentStreak, mechanicsPlayed };
    const existingBadges = new Set(prev?.badges || []);
    BADGE_RULES.forEach(b => {
      if(!existingBadges.has(b.id) && b.check(progressState, isPerfect)) existingBadges.add(b.id);
    });

    await setDoc(ref, {
      name: student.namaAnak,
      tahun: student.tahun,
      kelas: student.kelas,
      totalStars: increment(score),
      totalPlays: increment(1),
      mechanicsPlayed: { [mechanic]: increment(1) },
      currentStreak, longestStreak,
      lastPlayedDate: today,
      badges: [...existingBadges],
      updatedAt: today
    }, { merge:true });
  }catch(e){
    console.warn('Gagal menyimpan kemajuan:', e);
  }
}

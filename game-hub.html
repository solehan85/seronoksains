<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seronok Sains — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#29ABE2; --sky-deep:#1E8FC4; --sun:#FFD23F; --grass:#4ECB71;
    --navy:#1B3358; --cream:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  body{
    margin:0; min-height:100vh; font-family:'Nunito', sans-serif;
    background: radial-gradient(ellipse at top, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #shell{ width:100%; max-width:440px; }
  header{ text-align:center; color:#fff; margin-bottom:10px; }
  #mascot-mini{ width:60px; height:60px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2)); }
  header h1{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:19px; margin:6px 0 0; text-shadow:0 3px 0 rgba(27,51,88,0.35); }
  header p{ margin:2px 0 0; font-weight:700; font-size:13px; opacity:0.9; }

  .card{
    background:var(--cream); border-radius:26px; padding:20px; text-align:center;
    box-shadow:0 10px 0 rgba(27,51,88,0.25), 0 14px 28px rgba(0,0,0,0.2);
  }
  #no-session p{ color:#5C7690; font-weight:700; font-size:14px; }

  .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .menu-item{
    display:block; text-decoration:none;
    background:linear-gradient(160deg, #EAF6FC, #DCEEF7);
    border-radius:20px; padding:18px 10px 14px; text-align:center;
    border:3px solid transparent;
    transition: all 0.15s cubic-bezier(.34,1.56,.64,1);
  }
  .menu-item:active{ transform:scale(0.96); }
  .menu-item .emoji{ font-size:32px; display:block; margin-bottom:6px; }
  .menu-item .label{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px; color:var(--navy); }
  .menu-item .sub{ font-size:10.5px; font-weight:700; color:#5C7690; margin-top:2px; }
  .menu-item.locked{ opacity:0.55; cursor:default; background:#F0F3F6; }
  .menu-item.locked .label{ color:#8296AC; }

  .overlay{
    display:none; position:fixed; inset:0; background:rgba(27,51,88,0.55);
    align-items:center; justify-content:center; z-index:200; padding:16px;
  }
  .overlay.show{ display:flex; }
  .modal{
    width:100%; max-width:360px; background:var(--cream); border-radius:24px;
    padding:22px 20px; box-shadow:0 14px 28px rgba(0,0,0,0.3); text-align:center;
  }
  .modal h3{ font-family:'Baloo 2', sans-serif; color:var(--navy); margin:0 0 14px; font-size:17px; }
  .topik-choice{
    display:block; width:100%; text-align:left; text-decoration:none;
    background:#EAF6FC; color:var(--navy); font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:14px; padding:14px 16px; border-radius:14px;
    margin-bottom:10px;
  }
  .topik-choice:active{ background:#DCEEF7; }
  .modal-close{
    display:block; margin:10px auto 0; background:none; border:none;
    color:#5C7690; font-weight:700; font-size:13px; cursor:pointer; text-decoration:underline;
  }

  #btn-switch{
    display:block; margin:16px auto 0; background:none; border:none;
    color:#fff; font-weight:700; font-size:13px; text-decoration:underline; cursor:pointer;
  }
</style>
</head>
<body>
<div id="shell">
  <header>
    <svg id="mascot-mini" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="56" rx="28" ry="30" fill="#4FC3E0"/>
      <ellipse cx="50" cy="64" rx="17" ry="19" fill="#FFF6EC"/>
      <path d="M 47 22 Q 50 6 54 21" stroke="#3B9FC4" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M 22 50 Q 4 56 10 76 Q 24 74 28 58 Z" fill="#3B9FC4"/>
      <path d="M 78 50 Q 96 56 90 76 Q 76 74 72 58 Z" fill="#3B9FC4"/>
      <circle cx="38" cy="48" r="13" fill="#fff"/>
      <circle cx="62" cy="48" r="13" fill="#fff"/>
      <circle cx="40" cy="49" r="7" fill="#1B3358"/>
      <circle cx="64" cy="49" r="7" fill="#1B3358"/>
      <circle cx="43" cy="45" r="2.2" fill="#fff"/>
      <circle cx="67" cy="45" r="2.2" fill="#fff"/>
      <path d="M 45 60 Q 50 55 55 60 Q 50 68 45 60 Z" fill="#FF9F43"/>
    </svg>
    <h1 id="greeting">Selamat datang!</h1>
    <p id="meta"></p>
  </header>

  <div class="card" id="menu-card" style="display:none;">
    <div class="menu-grid">
      <button class="menu-item" id="item-klasifikasi" type="button" style="border:none; width:100%; font-family:inherit;">
        <span class="emoji">🗂️</span>
        <span class="label">Klasifikasi</span>
        <span class="sub" id="klasifikasi-sub">Memuatkan...</span>
      </button>
      <div class="menu-item locked">
        <span class="emoji">🏷️</span>
        <span class="label">Label Rajah</span>
        <span class="sub">Akan Datang</span>
      </div>
      <div class="menu-item locked">
        <span class="emoji">⚡</span>
        <span class="label">Quiz Pantas</span>
        <span class="sub">Akan Datang</span>
      </div>
      <div class="menu-item locked">
        <span class="emoji">🧪</span>
        <span class="label">Simulasi Mini</span>
        <span class="sub">Akan Datang</span>
      </div>
    </div>
  </div>

  <div class="card" id="no-session" style="display:none;">
    <p>Tiada sesi aktif. Sila log masuk dahulu.</p>
  </div>

  <button id="btn-switch">Tukar Profil</button>
</div>

<div class="overlay" id="overlay-topik">
  <div class="modal">
    <h3>Pilih Topik Klasifikasi</h3>
    <div id="topik-list"></div>
    <button class="modal-close" id="topik-cancel">Batal</button>
  </div>
</div>

<script>
  const raw = sessionStorage.getItem('ss_activeStudent');
  let activeStudent = null;
  if(raw){
    activeStudent = JSON.parse(raw);
    document.getElementById('greeting').textContent = `Hai, ${activeStudent.namaAnak}! 👋`;
    document.getElementById('meta').textContent = `Tahun ${activeStudent.tahun} · ${activeStudent.kelas}`;
    document.getElementById('menu-card').style.display = '';
  } else {
    document.getElementById('greeting').textContent = 'Tiada sesi aktif';
    document.getElementById('no-session').style.display = '';
  }

  let klasifikasiBank = null;
  async function loadKlasifikasiBank(){
    if(klasifikasiBank) return klasifikasiBank;
    const res = await fetch('data/klasifikasi-questions.json');
    klasifikasiBank = await res.json();
    return klasifikasiBank;
  }
  function topicsForTahun(bank, tahun){
    return Object.entries(bank).filter(([key, topic]) => topic.tahun === tahun);
  }

  if(activeStudent){
    loadKlasifikasiBank().then(bank => {
      const matching = topicsForTahun(bank, activeStudent.tahun);
      document.getElementById('klasifikasi-sub').textContent =
        matching.length ? `${matching.length} topik tersedia` : 'Belum ada topik';
    });
  }

  document.getElementById('btn-switch').addEventListener('click', ()=>{
    sessionStorage.removeItem('ss_activeStudent');
    window.location.href = 'parent-login.html';
  });

  const overlayTopik = document.getElementById('overlay-topik');
  const topikList = document.getElementById('topik-list');
  document.getElementById('item-klasifikasi').addEventListener('click', async ()=>{
    const bank = await loadKlasifikasiBank();
    const matching = topicsForTahun(bank, activeStudent.tahun);
    topikList.innerHTML = matching.length
      ? matching.map(([key, topic]) =>
          `<a class="topik-choice" href="klasifikasi.html?topik=${key}">${topic.binA.emoji} ${topic.topikLabel}</a>`
        ).join('')
      : `<p style="color:#5C7690; font-weight:700; font-size:13px;">Belum ada topik untuk Tahun ${activeStudent.tahun} lagi.</p>`;
    overlayTopik.classList.add('show');
  });
  document.getElementById('topik-cancel').addEventListener('click', ()=>{
    overlayTopik.classList.remove('show');
  });
</script>
</body>
</html>

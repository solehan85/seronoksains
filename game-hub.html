<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seronok Sains — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --sky:#29ABE2; --sky-deep:#1E8FC4; --navy:#1B3358; --cream:#FFFFFF; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Nunito', sans-serif;
    background: radial-gradient(ellipse at top, #6FC6F0 0%, var(--sky) 55%, var(--sky-deep) 100%);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card{
    background:var(--cream); border-radius:26px; padding:28px 24px; text-align:center;
    max-width:400px; width:100%;
    box-shadow:0 10px 0 rgba(27,51,88,0.25), 0 14px 28px rgba(0,0,0,0.2);
  }
  h1{ font-family:'Baloo 2', sans-serif; color:var(--navy); font-size:20px; margin:0 0 6px; }
  p{ color:#5C7690; font-weight:700; margin:0 0 20px; font-size:14px; }
  .placeholder{
    background:#EAF6FC; border-radius:18px; padding:18px; color:var(--sky-deep);
    font-weight:700; font-size:13px; margin-bottom:18px;
  }
  a.btn{
    display:inline-block; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    color:var(--navy); background:#EAF6FC; text-decoration:none;
    padding:10px 20px; border-radius:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1 id="greeting">Selamat datang!</h1>
    <p id="meta"></p>
    <div class="placeholder">🚧 Menu permainan (Klasifikasi, Label Rajah, Quiz Pantas, Simulasi Mini) akan dipaparkan di sini — belum dibina lagi.</div>
    <a class="btn" href="parent-login.html">← Kembali ke Log Masuk</a>
  </div>
<script>
  const raw = sessionStorage.getItem('ss_activeStudent');
  if(raw){
    const s = JSON.parse(raw);
    document.getElementById('greeting').textContent = `Hai, ${s.namaAnak}! 👋`;
    document.getElementById('meta').textContent = `Tahun ${s.tahun} · ${s.kelas}`;
  } else {
    document.getElementById('greeting').textContent = 'Tiada sesi aktif';
    document.getElementById('meta').textContent = 'Sila log masuk dahulu.';
  }
</script>
</body>
</html>
